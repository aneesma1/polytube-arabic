 साल यहां की आबादी शून्य रहती है।`,ta:`மக்கள் வசிக்காத ஒரு பகுதி, ஆண்டு முழுவதும் இங்கு மக்கள் தொகை பூஜ்ஜியம்.`,ar:`منطقة صفرية عدد سكانها صفر طول السنة.`,ur:`ایک صفر آبادی والا علاقہ، جہاں سال بھر آبادی صفر رہتی ہے۔`},2:{en:`And suddenly, it becomes home to 2 million people from over 100 nationalities around the globe!`,ml:`പെട്ടെന്നാണ് ലോകമെമ്പാടുമുള്ള 100-ലധികം രാജ്യങ്ങളിൽ നിന്നുള്ള 20 ലക്ഷം ജനങ്ങളായി ഇവിടുത്തെ ജനസംഖ്യ മാറുന്നത്!`,hi:`और अचानक दुनिया भर की 100 से अधिक राष्ट्रीयताओं के 20 लाख लोगों की आबादी बन जाती है!`,ta:`திடீரென்று உலகெங்கிலும் உள்ள 100-க்கும் மேற்பட்ட நாடுகளிலிருந்து 20 லட்சம் மக்களாக இது மாறுகிறது!`,ar:`وفجأة يصبح عدد سكانها ٢ مليون نسمة من أكثر من ١٠٠ جنسية حول العالم!`,ur:`اور اچانک دنیا کی ۱۰۰ سے زائد قومیتوں کے ۲۰ لاکھ نفوس کی آبادی بن جاتی ہے!`},3:{en:`And suddenly, the population returns to zero in just 12 hours. We are right here in Arafat and Mount Mercy.`,ml:`വെറും 12 മണിക്കൂറിനുള്ളിൽ ജനസംഖ്യ വീണ്ടും പൂജ്യത്തിലേക്ക് മടങ്ങുന്നു. ഞങ്ങൾ ഇപ്പോൾ അറഫയിലും കാരുണ്യത്തിന്റെ മലയിലുമാണ്.`,hi:`और सिर्फ 12 घंटों में आबादी वापस शून्य हो जाती है। हम इस वक्त अराफात और जबल-ए-रहमत पर हैं।`,ta:`வெறும் 12 மணி நேரத்திற்குள் மக்கள் தொகை மீண்டும் பூஜ்ஜியமாகிறது. நாம் இப்போது அரஃபாவிலும் ஜபல் அல்-ரஹ்மாவிலும் இருக்கிறோம்.`,ar:`يرجع عدد السكان صفر خلال ١٢ ساعة فقط، إحنا هنا في عرفة وجبل الرحمة.`,ur:`اور صرف ۱۲ گھنٹوں میں آبادی پھر صفر ہو جاتی ہے۔ ہم اس وقت عرفات اور جبل الرحمہ پر موجود ہیں۔`},4:{en:`May your Hajj be blessed and accepted, dear pilgrim! Please remember us in your prayers!`,ml:`ഹജ്ജ് സ്വീകരിക്കപ്പെടട്ടെ പ്രിയപ്പെട്ട ഉമ്മച്ചീ, ഞങ്ങളെയും പ്രാർത്ഥനയിൽ ഓർക്കണേ!`,hi:`हज मबरूर हो माँ जी, ईश्वर आप पर कृपा करे... अपनी दुआओं में हमें याद रखिएगा!`,ta:`ஹஜ் மப்ரூராக அமையட்டும்! உங்கள் பிரார்த்தனைகளில் எங்களை நினைவில் கொள்ளுங்கள்!`,ar:`حج مبرور يا حجة، والنعم فيكم والله... دعواتك!`,ur:`حج مبرور ہو محترمہ، اللہ آپ پر فضل فرمائے... دعاؤں میں یاد رکھیے گا!`},5:{en:`Before we begin, let's go back in time and look at the number of pilgrims throughout history.`,ml:`തുടങ്ങുന്നതിന് മുമ്പ്, നമുക്ക് ചരിത്രത്തിലേക്ക് ഒന്ന് തിരിഞ്ഞുനോക്കാം, കാലങ്ങളായുള്ള തീർത്ഥാടകരുടെ എണ്ണം പരിശോധിക്കാം.`,hi:`शुरू करने से पहले, आइए इतिहास में पीछे चलते हैं और देखते हैं कि तीर्थयात्रियों की संख्या कैसे रही।`,ta:`தொடங்குவதற்கு முன், நாம் வரலாற்றைத் திரும்பிப் பார்த்து யாத்ரீகர்களின் எண்ணிக்கையைக் கவனிப்போம்.`,ar:`قبل لا نبدأ، خلينا نرجع بالزمن للورا ونشوف أعداد الحجاج عبر التاريخ.`,ur:`شروع کرنے سے پہلے، تاریخ میں پیچھے چلتے ہیں اور دیکھتے ہیں کہ حجاج کی تعداد کیا رہی ہے۔`},6:{en:`We will find that the numbers did not exceed tens of thousands each year, so things were easy and managing them was simple.`,ml:`ഓരോ വർഷവും ആളുകളുടെ എണ്ണം പതിനായിരങ്ങളിൽ കവിഞ്ഞിരുന്നില്ലെന്ന് നമുക്ക് കാണാം, കാര്യങ്ങൾ വളരെ എളുപ്പവും കൈകാര്യം ചെയ്യാൻ ലളിതവുമായിരുന്നു.`,hi:`हम पाएंगे कि संख्या हर साल कुछ दसियों हज़ार से अधिक नहीं थी, इसलिए सब आसान था और प्रबंधन सरल था।`,ta:`ஆண்டுதோறும் மக்களின் எண்ணிக்கை பத்தாயிரங்களைத் தாண்டவில்லை, எனவே மேலாண்மை மிகவும் எளிதாக இருந்தது.`,ar:`حنلاقي إنه الأعداد ما كانت تتجاوز عشرات الآلاف كل سنة، فكانت الأمور سهلة وإدارتهم بسيطة.`,ur:`ہم دیکھیں گے کہ تعداد ہر سال چند ہزار سے زیادہ نہیں تھی، اس لیے انتظام بہت آسان تھا۔`},7:{en:`To the extent that Al-Madina Newspaper announced in 1964 the biggest Hajj in the Kingdom’s history — imagine that, how many people do you think there were?`,ml:`1964-ൽ അൽ-മദീന പത്രം രാജ്യത്തിന്റെ ചരിത്രത്തിലെ ഏറ്റവും വലിയ ഹജ്ജ് എന്ന് തലക്കെട്ട് നൽകിയപ്പോൾ ആകെ എത്ര ആളുകളുണ്ടായിരുന്നു എന്ന് ഊഹിക്കാമോ?`,hi:`यहाँ तक कि अल-मदीना अखबार ने 1964 में राज्य के इतिहास का सबसे बड़ा हज घोषित किया—ज़रा सोचिए, कितने लोग रहे होंगे?`,ta:`1964 இல் அல்-மதீனா நாளிதழ் வரலாற்றின் மிகப்பெரிய ஹஜ் என்று அறிவித்தபோது, எத்தனை பேர் இருந்தார்கள் என்று எண்ணிப்பாருங்கள்?`,ar:`لدرجة إنه جريدة المدينة أعلنت سنة ١٩٦٤ أكبر حج في تاريخ المملكة! تخيلوا كم تتوقعوا كانت الأعداد؟`,ur:`یہاں تک کہ المدینہ اخبار نے ۱۹۶۴ میں تاریخ کا سب سے بڑا حج قرار دیا—سوچیے تو کتنے لوگ ہوں گے؟`},8:{en:`Only 128,000 pilgrims! After that, with easier travel and technology, the numbers increased year after year.`,ml:`വെറും 128,000 തീർത്ഥാടകർ മാത്രം! പിന്നീട് യാത്രാസൗകര്യങ്ങളും സാങ്കേതികവിദ്യയും വർദ്ധിച്ചതോടെ വർഷം തോറും എണ്ണം കുതിച്ചുയർന്നു.`,hi:`सिर्फ 128,000 हाजी! इसके बाद, आसान यात्रा और तकनीक के साथ, संख्या साल दर साल बढ़ती गई।`,ta:`வெறும் 128,000 யாத்ரீகர்கள் மட்டுமே! அதன் பிறகு பயண வசதிகள் வளர்ந்ததால் எண்ணிக்கை ஆண்டுதோறும் உயர்ந்தது.`,ar:`١٢٨ ألف حاج فقط! وبعدها مع سهولة السفر والتقنية زادت الأعداد سنة بعد سنة.`,ur:`صرف ۱۲۸ ہزار حجاج! اس کے بعد سفری سہولیات اور ٹیکنالوجی کی بدولت تعداد سال بہ سال بڑھتی گئی۔`},9:{en:`And the first year the number of pilgrims reached one million was in 1979, for the first time in history.`,ml:`ചരിത്രത്തിലാദ്യമായി തീർത്ഥാടകരുടെ എണ്ണം 10 ലക്ഷം (ഒരു മില്യൺ) കടന്നത് 1979-ലായിരുന്നു.`,hi:`और पहला साल जब हाजियों की तादाद 10 लाख तक पहुंची, वह 1979 था, इतिहास में पहली बार।`,ta:`வரலாற்றில் முதன்முறையாக யாத்ரீகர்களின் எண்ணிக்கை 10 லட்சத்தை எட்டியது 1979 ஆம் ஆண்டாகும்.`,ar:`وأول سنة يوصل فيها عدد الحجاج لمليون حاج كان سنة ١٩٧٩ لأول مرة في التاريخ.`,ur:`اور پہلا سال جب حجاج کی تعداد ۱۰ لاکھ تک پہنچی وہ ۱۹۷۹ تھا، تاریخ میں پہلی بار۔`},10:{en:`And just 16 years later, the number of pilgrims reached 2 million!`,ml:`വെറും 16 വർഷങ്ങൾക്ക് ശേഷം അത് 20 ലക്ഷമായി (രണ്ട് മില്യൺ) കുതിച്ചുയർന്നു!`,hi:`और उसके सिर्फ 16 साल बाद, हाजियों की संख्या 20 लाख तक पहुंच गई!`,ta:`வெறும் 16 ஆண்டுகளுக்குப் பிறகு யாத்ரீകர்களின் எண்ணிக்கை 20 லட்சமாக உயர்ந்தது!`,ar:`وبعدها بـ ١٦ سنة فقط وصلوا الحجاج إلى ٢ مليون حاج!`,ur:`اور صرف ۱۶ سال بعد حجاج کی تعداد ۲۰ لاکھ تک جا پہنچی!`},11:{en:`That’s forty times the number of people who used to perform Hajj in the past!`,ml:`അതായത് മുൻകാലങ്ങളിൽ ഹജ്ജിനെത്തിയിരുന്നതിനേക്കാൾ 40 ഇരട്ടി വർദ്ധനവ്!`,hi:`यानी अतीत में हज करने वाले लोगों की तुलना में 40 गुना अधिक!`,ta:`அதாவது கடந்த காலத்தில் ஹஜ் செய்தவர்களின் எண்ணிக்கையை விட 40 மடங்கு அதிகம்!`,ar:`يعني ٤٠ ضعف الأعداد التي كانت تروح الحج في الماضي!`,ur:`یعنی ماضی میں حج پر جانے والوں کے مقابلے میں ۴۰ گنا زیادہ!`},12:{en:`Today, Day of Arafat, 7:00 AM, they have begun.`,ml:`ഇന്ന്, അറഫാ ദിനം, രാവിലെ 7:00 മണിക്ക് കർമ്മങ്ങൾ ആരംഭിച്ചു.`,hi:`आज, अराफात का दिन, सुबह 7:00 बजे, वे शुरू हो चुके हैं।`,ta:`இன்று, அரஃபா நாள், காலை 7:00 மணிக்கு தொடங்கினர்.`,ar:`اليوم، عرفة، الساعة ٧ الصباح بدأوا.`,ur:`آج، عرفہ کا دن، صبح ۷ بجے، انہوں نے آغاز کیا۔`},13:{en:`The pilgrims started arriving at Arafat from Mina. How is this massive crowd managed? From right here: The Command and Control Center.`,ml:`മിനായിൽ നിന്ന് തീർത്ഥാടകർ അറഫയിലേക്ക് എത്തിത്തുടങ്ങി. ഈ മഹാ ജനക്കൂട്ടത്തെ എങ്ങനെയാണ് നിയന്ത്രിക്കുന്നത്? ഇവിടെ നിന്ന്: കമാൻഡ് ആൻഡ് കൺട്രോൾ സെന്ററിൽ നിന്ന്.`,hi:`हाजी मीना से अराफात पहुंचना शुरू हो गए हैं। इस भारी भीड़ को कैसे प्रबंधित किया जाता है? यहां से: कमान और नियंत्रण केंद्र।`,ta:`யாத்ரீகர்கள் மினாவிலிருந்து அரஃபாவுக்கு வரத் தொடங்கினர். இந்த மிகப்பெரிய கூட்டம் எவ்வாறு கட்டுப்படுத்தப்படுகிறது? இங்கிருந்து: கட்டளை மற்றும் கட்டுப்பாட்டு மையம்.`,ar:`الحجاج يوصلوا إلى عرفة من منى، كيف بتتم إدارة هذه الحشود الضخمة؟ من هنا: مركز القيادة والسيطرة.`,ur:`حجاج منیٰ سے عرفات پہنچنا شروع ہو گئے۔ اس عظیم ہجوم کا انتظام کیسے ہوتا ہے؟ یہاں سے: کمانڈ اینڈ کنٹرول سینٹر۔`},14:{en:`Welcome, doctor. May God grant you strength! What are the biggest challenges in Mina?`,ml:`സ്വാഗതം ഡോക്ടർ, അങ്ങേയ്ക്ക് ആരോഗ്യം നൽകട്ടെ! മിനായിലെ ഏറ്റവും വലിയ വെല്ലുവിളികൾ എന്തൊക്കെയാണ്?`,hi:`स्वागत है डॉक्टर साहब, ईश्वर आपको शक्ति दे! मीना में सबसे बड़ी चुनौतियाँ क्या हैं?`,ta:`வரவேற்கிறோம் டாக்டர், இறைவன் உங்களுக்கு வலிமை தரட்டும்! மினாவில் மிகப்பெரிய சவால்கள் என்ன?`,ar:`حي الله دكتور، يعطيك العافية، إيش أكبر التحديات في منى؟`,ur:`خوش آمدید ڈاکٹر صاحب، اللہ آپ کو صحت دے! منیٰ میں سب سے بڑے چیلنجز کیا ہیں؟`},15:{en:`The challenge in Mina is that it has specific canonical boundaries—it’s a confined space that cannot be expanded!`,ml:`മിനായിലെ പ്രധാന വെല്ലുവിളി: അതിന് മതപരമായ കൃത്യമായ അതിരുകളുണ്ട്, സ്ഥലം പരിമിതമാണ്, അങ്ങോട്ട് വികസിപ്പിക്കാൻ കഴിയില്ല!`,hi:`मीना में मुख्य चुनौती: इसकी शरिया द्वारा निर्धारित सीमाएँ हैं, यह एक सीमित स्थान है जिसका विस्तार नहीं किया जा सकता!`,ta:`மினாவில் உள்ள சவால்: அதற்கு வரையறுக்கப்பட்ட ஷரீஆ எல்லைகள் உள்ளன, அதை விரிவுபடுத்த முடியாது!`,ar:`التحدي في منى: لها حدود شرعية محددة، مكان محصور ما تقدر توسع!`,ur:`منیٰ میں چیلنج: اس کی شرعی حدود متعین ہیں، یہ محدود جگہ ہے جسے پھیلایا نہیں جا سکتا!`},16:{en:`You have to accommodate 2 million people within just 24 hours all of a sudden!`,ml:`വെറും 24 മണിക്കൂറിനുള്ളിൽ 20 ലക്ഷം ജനങ്ങളെ പെട്ടെന്ന് ഉൾക്കൊള്ളേണ്ടതുണ്ട്!`,hi:`सिर्फ 24 घंटों के भीतर अचानक 20 लाख लोगों का स्वागत करना होता है!`,ta:`வெறும் 24 மணி நேரத்திற்குள் திடீரென 20 லட்சம் மக்களை வரவேற்க வேண்டும்!`,ar:`تستقبل ٢ مليون خلال ٢٤ ساعة فجأة!`,ur:`صرف ۲۴ گھنٹوں میں اچانک ۲۰ لاکھ افراد کا استقبال کرنا ہوتا ہے!`},17:{en:`Just to give you an idea of the density: The most densely populated city in the world, Manila in the Philippines, has around 40,000 people per square kilometer.`,ml:`ജനസാന്ദ്രതയെക്കുറിച്ച് ഒരു ധാരണ നൽകാൻ: ലോകത്തിലെ ഏറ്റവും ജനസാന്ദ്രതയുള്ള നഗരമായ ഫിലിപ്പീൻസിലെ മനിലയിൽ ഒരു ചതുരശ്ര കിലോമീറ്ററിൽ 40,000 ആളുകളുണ്ട്.`,hi:`घनत्व का अंदाजा देने के लिए: दुनिया का सबसे घना शहर, फिलीपींस का मनीला, प्रति वर्ग किलोमीटर लगभग 40,000 लोग हैं।`,ta:`அடர்த்தியைப் பற்றிய புரிதலுக்கு: உலகின் மிக அதிக அடர்த்தி கொண்ட நகரமான மணிலாவில் ஒரு சதுர கிலோமீட்டருக்கு 40,000 மக்கள் உள்ளனர்.`,ar:`عشان أديك فكرة عن الكثافة: أكثر المدن كثافة في العالم مانيلا في الفلبين فيها تقريباً ٤٠ ألف إنسان لكل كيلومتر مربع.`,ur:`کثافت کا اندازہ لگانے کے لیے: دنیا کا سب سے گنجان آباد شہر منیلا ہے، جہاں فی مربع کلومیٹر تقریباً ۴۰ ہزار افراد ہیں۔`},18:{en:`Another place with even bigger crowds than cities, like Disneyland for example, its population density reaches 116,000 people per square kilometer.`,ml:`നഗരങ്ങളേക്കാൾ വലിയ ജനക്കൂട്ടമുള്ള ഡിസ്നിലാൻഡ് പോലുള്ള സ്ഥലത്ത് ഒരു ചതുരശ്ര കിലോമീറ്ററിൽ 116,000 ആളുകളുണ്ട്.`,hi:`शहरों से भी अधिक भीड़ वाली जगह, जैसे डिज्नीलैंड, वहां का जनसंख्या घनत्व प्रति वर्ग किमी 116,000 लोग है।`,ta:`நகரங்களை விட அதிக கூட்ட நெரிசல் கொண்ட டிஸ்னிலேண்ட் போன்ற இடத்தில் ஒரு சதுர கிலோமீட்டருக்கு 116,000 மக்கள் உள்ளனர்.`,ar:`مكان ثان فيه تجمعات أكثر حتى من المدن، زي ديزني لاند مثلاً، الكثافة السكانية حقته ١١٦ ألف شخص لكل كيلومتر مربع.`,ur:`شہروں سے بھی زیادہ ہجوم والی جگہ، جیسے ڈزنی لینڈ، وہاں کی کثافت فی مربع کلومیٹر ۱۱۶ ہزار افراد ہے۔`},19:{en:`In Mina, we are talking about ONE MILLION people per square kilometer! That’s 10 times the density of Disneyland!`,ml:`എന്നാൽ മിനായിൽ ഒരു ചതുരശ്ര കിലോമീറ്ററിൽ 10 ലക്ഷം ആളുകളാണ് ഉള്ളത്! അതായത് ഡിസ്നിലാൻഡിലെ സാന്ദ്രതയുടെ 10 ഇരട്ടി!`,hi:`मीना में, हम प्रति वर्ग किलोमीटर 10 लाख लोगों की बात कर रहे हैं! यानी डिज्नीलैंड के घनत्व से 10 गुना!`,ta:`மினாவில் ஒரு சதுர கிலோமீட்டருக்கு 10 லட்சம் மக்கள்! டிஸ்னிலேண்ட் அடர்த்தியை விட 10 மடங்கு அதிகம்!`,ar:`مشعر منى نتكلم على مليون شخص لكل كيلومتر مربع! يعني ١٠ أضعاف الكثافة التي تحصل في ديزني لاند.`,ur:`منیٰ میں فی مربع کلومیٹر ۱۰ لاکھ افراد ہیں! یعنی ڈزنی لینڈ سے ۱۰ گنا زیادہ کثافت!`},20:{en:`And 15 to 20 times the densest cities in the world! This extreme density leads to immense logistical challenges.`,ml:`ലോകത്തിലെ ഏറ്റവും സാന്ദ്രതയേറിയ നഗരങ്ങളേക്കാൾ 15 മുതൽ 20 ഇരട്ടി കൂടുതൽ! ഈ അതിഭീമമായ സാന്ദ്രത വലിയ വെല്ലുവിളികളിലേക്ക് നയിക്കുന്നു.`,hi:`और दुनिया के सबसे घने शहरों से 15 से 20 गुना अधिक! यह अत्यधिक घनत्व भारी चुनौतियों को जन्म देता है।`,ta:`மற்றும் உலகின் மிக அடர்த்தியான நகரங்களை விட 15 முதல் 20 மடங்கு அதிகம்! இது பெரும் சவால்களுக்கு வழிவகுக்கிறது.`,ar:`و١٥ أو ٢٠ ضعف أكثف المدن في العالم! هذه الكثافة تؤدي إلى تحديات كبيرة.`,ur:`اور دنیا کے گنجان ترین شہروں سے ۱۵ تا ۲۰ گنا زیادہ! یہ شدید کثافت بڑے چیلنجز پیدا کرتی ہے۔`},21:{en:`The challenge of their movement, the challenge of healthcare, and the challenge of all public services provided to them.`,ml:`അവരുടെ യാത്രകളും നീക്കങ്ങളും നിയന്ത്രിക്കുക, ആരോഗ്യപരിപാലനം ഉറപ്പാക്കുക, അവർക്ക് നൽകേണ്ട സേവനങ്ങൾ ഏകോപിപ്പിക്കുക.`,hi:`उनकी आवाजाही की चुनौती, स्वास्थ्य देखभाल की चुनौती, और उन्हें दी जाने वाली सेवाओं की चुनौती।`,ta:`அவர்களின் நடமாட்டத்திற்கான சவால், சுகாதாரப் பாதுகாப்பு மற்றும் அவர்களுக்கு வழங்கப்படும் சேவைகளின் சவால்.`,ar:`تحدي تحركاتهم، تحدي رعايتهم الصحية، وتحدي الخدمات التي تقدم لهم.`,ur:`ان کی نقل و حرکت، صحت کی دیکھ بھال اور تمام بنیادی خدمات کی فراہمی کے چیلنجز۔`},22:{en:`Water supply, toilets, housing... massive challenges arising from this extreme density.`,ml:`കുടിവെള്ളം, ശുചിമുറികൾ, താമസസൗകര്യം... ജനസാന്ദ്രത കാരണം ഉണ്ടാകുന്ന വലിയ വെല്ലുവിളികൾ.`,hi:`पानी, शौचालय, आवास... भारी घनत्व से उत्पन्न होने वाली विशाल चुनौतियाँ।`,ta:`குடிநீர், கழிப்பறைகள், தங்குமிடம்... அதிக நெரிசலால் ஏற்படும் மிகப்பெரிய சவால்கள்.`,ar:`الماية، الحمامات، الإقامة... تحديات كبيرة جاية من الكثافة الشديدة.`,ur:`پانی، واش رومز، رہائش... اس شدید کثافت سے پیدا ہونے والے بڑے مسائل۔`},23:{en:`We build entire service cities from scratch, and we move an entire city three or four times in a single day!`,ml:`ഞങ്ങൾ സേവന നഗരങ്ങൾ പുതുതായി നിർമ്മിക്കുകയും, ഒരു ദിവസം തന്നെ ഒരു നഗരത്തെ മുഴുവനായി മൂന്നോ നാലോ തവണ മാറ്റി സ്ഥാപിക്കുകയും ചെയ്യുന്നു!`,hi:`हम पूरे सेवा नगर बनाते हैं, और एक ही दिन में पूरे शहर को तीन या चार बार स्थानांतरित करते हैं!`,ta:`நாங்கள் புதிய சேவை நகரங்களை உருவாக்குகிறோம், ஒரே நாளில் ஒரு முழு நகரத்தை மூன்று நான்கு முறை இடமாற்றுகிறோம்!`,ar:`إحنا ننشئ مدناً خدمية، ونحرك مدينة كاملة في اليوم ثلاث أو أربع مرات!`,ur:`ہم مکمل سروس سٹیز قائم کرتے ہیں، اور ایک ہی دن میں پورے شہر کو تین چار بار منتقل کرتے ہیں!`},24:{en:`From Arafat to Muzdalifah, from Muzdalifah to Mina, and from Mina to the Grand Mosque: we move an entire city every 6 to 7 hours!`,ml:`അറഫയിൽ നിന്ന് മുസ്ദലിഫയിലേക്ക്, മുസ്ദലിഫയിൽ നിന്ന് മിനായിലേക്ക്, മിനായിൽ നിന്ന് മസ്ജിദുൽ ഹറാമിലേക്ക്: ഓരോ 6-7 മണിക്കൂറിലും ഒരു നഗരത്തെ ഞങ്ങൾ മാറ്റിപ്പാർപ്പിക്കുന്നു!`,hi:`अराफात से मुजदलिफा, मुजदलिफा से मीना, और मीना से हरम: हम हर 6 या 7 घंटे में एक शहर को स्थानांतरित करते हैं!`,ta:`அரஃபாவிலிருந்து முஸ்தலிஃபாவுக்கு, முஸ்தலிஃபாவிலிருந்து மினாவுக்கு, மினாவிலிருந்து ஹரமுக்கு: ஒவ்வொரு 6-7 மணி நேரத்திற்கும் ஒரு நகரத்தையே நகர்த்துகிறோம்!`,ar:`من عرفة إلى مزدلفة، ومن مزدلفة إلى منى، ومن منى إلى الحرم: نحرك مدينة كل ٦ أو ٧ ساعات!`,ur:`عرفات سے مزدلفہ، مزدلفہ سے منیٰ، اور منیٰ سے حرم: ہر ۶ یا ۷ گھنٹے بعد پورا شہر منتقل کرتے ہیں!`},25:{en:`Here we are talking about more than 100 nationalities coming from every distant mountain highway.`,ml:`വിദൂര ദിക്കുകളിൽ നിന്നെല്ലാം എത്തിച്ചേർന്ന 100-ലധികം രാജ്യക്കാരായ ആളുകളെക്കുറിച്ചാണ് നാം ഇവിടെ സംസാരിക്കുന്നത്.`,hi:`यहाँ हम 100 से अधिक देशों से आए लोगों की बात कर रहे हैं, जो हर दूर-दराज के रास्ते से आए हैं।`,ta:`தொலைதூரப் பகுதிகளிலிருந்து வருகை தந்த 100-க்கும் மேற்பட்ட நாடுகளைச் சேர்ந்த மக்களைப் பற்றி நாம் பேசுகிறோம்.`,ar:`إحنا هنا بنتكلم على أكثر من ١٠٠ جنسية جاية من كل فج عميق.`,ur:`ہم یہاں ۱۰۰ سے زائد ممالک کے لوگوں کی بات کر رہے ہیں جو دور دراز سے آئے ہیں۔`},26:{en:`“I’m from Jordan!” Welcome people of Zarqa! Welcome Egypt, India, Pakistan, Kurdistan, and welcome blessed Yemen!`,ml:`“ഞാൻ ജോർദാനിൽ നിന്നാണ്!” സർഖയിലെ പ്രിയപ്പെട്ടവർക്ക് സ്വാഗതം! ഈജിപ്ത്, ഇന്ത്യ, പാകിസ്താൻ, കുർദിസ്ഥാൻ, യമൻ... എല്ലാവർക്കും സ്വാഗതം!`,hi:`“मैं जॉर्डन से हूँ!” ज़रका के लोगों का स्वागत है! मिस्र, भारत, पाकिस्तान, कुर्दिस्तान और यमन... सबका स्वागत है!`,ta:`“நான் ஜோர்டானிலிருந்து!” ஜர்கா மக்களுக்கு நல்வரவு! எகிப்து, இந்தியா, பாகிஸ்தான், குர்திஸ்தான், யெமன்... அனைவருக்கும் நல்வரவு!`,ar:`أنا من الأردن! أهلاً بأهل الزرقاء، أهلاً بمصر، الهند، باكستان، كردستان، ماشاء الله، هلا باليمن السعيد!`,ur:`”میں اردن سے ہوں!“ زرقاء کے باسیوں کو خوش آمدید! مصر، بھارت، پاکستان، کردستان اور یمن سب کا استقبال ہے!`},27:{en:`And in Arafat, it is said that one of the reasons for its name is the concept of mutual acquaintance (Ta‘āruf): "so that you may know one another".`,ml:`അറഫ എന്ന പേരിന് കാരണം തന്നെ “പരസ്പരം അറിയുക” (തആറുഫ്) എന്ന മഹത്തായ ആശയമാണെന്ന് പറയപ്പെടുന്നു: “നിങ്ങൾ പരസ്പരം തിരിച്ചറിയേണ്ടതിന് നാം നിങ്ങളെ വിവിധ ജനവിഭാഗങ്ങളാക്കി”.`,hi:`और अराफात में, कहा जाता है कि इसके नाम का एक कारण आपसी परिचय (तआरुफ़) की अवधारणा है: "ताकि तुम एक-दूसरे को पहचानो"।`,ta:`அரஃபா என்ற பெயருக்குக் காரணம் "ஒருவரையொருவர் அறிந்துகொள்ளுதல்" என்ற தத்துவம் என்று கூறப்படுகிறது.`,ar:`وفي عرفات يقال إن واحدة من أسباب اسم عرفات هي فكرة «التعارف»، مبدأ ﴿وجعلناكم شعوباً وقبائل لتعارفوا﴾.`,ur:`اور عرفات میں، کہا جاتا ہے کہ اس نام کی ایک وجہ باہمی تعارف کا تصور ہے: ”تاکہ تم ایک دوسرے کو پہچانو“۔`},28:{en:`What does "getting to know someone" mean? It means understanding their values, their thoughts, their traditions, their food, their habits—all of this falls under mutual acquaintance.`,ml:`ഒരാളെ അറിയുക എന്നാൽ എന്താണ്? അയാളുടെ മൂല്യങ്ങൾ, ചിന്തകൾ, പാരമ്പര്യങ്ങൾ, ഭക്ഷണം, ശീലങ്ങൾ എല്ലാം മനസ്സിലാക്കുക എന്നതാണ്.`,hi:`किसी को जानने का क्या मतलब है? इसका अर्थ है उनके मूल्यों, विचारों, परंपराओं, भोजन, आदतों को समझना।`,ta:`ஒருவரை அறிவது என்றால் என்ன? அவர்களின் கோட்பாடுகள், எண்ணங்கள், கலாச்சாரம், உணவு மற்றும் பழக்கவழக்கங்களை அறிவது.`,ar:`إيش يعني تتعرف عليه؟ يعني تفهم مبادئه، تفهم أفكاره، تقاليده، أكله، عاداته... كل هذا يندرج تحت مفهوم التعارف.`,ur:`کسی کو جاننے کا کیا مطلب ہے؟ یعنی اس کے اصولوں، افکار، روایات، خوراک اور عادات کو سمجھنا۔`},29:{en:`And with greater mutual understanding comes greater peaceful coexistence among all mankind.`,ml:`പരസ്പരമുള്ള അറിവും സ്നേഹവും കൂടുന്തോറും മനുഷ്യർ തമ്മിലുള്ള സമാധാനപരമായ സഹവർത്തിത്വവും വർദ്ധിക്കുന്നു.`,hi:`और अधिक आपसी समझ के साथ ही मानव जाति के बीच शांतिपूर्ण सह-अस्तित्व बढ़ता है।`,ta:`பரஸ்பர புரிதல் அதிகரிக்கும்போது மனிதர்களிடையே அமைதியான சகவாழ்வு வளர்கிறது.`,ar:`وبزيادة التعارف يزيد التعايش السلمي بين البشر.`,ur:`اور باہمی تعارف کے بڑھنے سے ہی انسانوں کے درمیان پرامن بقائے باہمی میں اضافہ ہوتا ہے۔`},30:{en:`“Teach me a Moroccan word I don’t know!” — “Tanjia!” A traditional Moroccan slow-cooked clay pot dish, specifically from Marrakesh!`,ml:`“എനിക്കറിയാത്ത ഒരു മൊറോക്കൻ വാക്ക് പഠിപ്പിച്ചു തരൂ!” — “തഞ്ജിയ്യ!” മൊറോക്കോയിലെ മർറാകേഷിലെ പ്രശസ്തമായ പരമ്പരാഗത മൺപാത്ര വിഭവം!`,hi:`“मुझे मोरक्कन का ऐसा शब्द सिखाओ जो मैं नहीं जानता!” — “तंजिया!” मोरक्को का पारंपरिक व्यंजन, विशेष रूप से मारकेश का!`,ta:`“எனக்குத் தெரியாத ஒரு மொராக்கோ வார்த்தையைக் கற்றுக்கொடுங்கள்!” — “தன்ஜியா!” மாரக்கேசின் பாரம்பரிய உணவு!`,ar:`علمني كلمة مغربية ما أعرفها! «طنجية»... أكلة مغربية بالأخص في مراكش، طنجية مراكشية!`,ur:`”مجھے مراکش کا کوئی نیا لفظ سکھائیں!“ — ”طنجیہ!“ مراکش اور بالخصوص مراکش شہر کا روایتی پکوان!`}},Ar=({onLoadVideo:e,onOpenExport:t,onOpenSettings:n,onOpenExtension:r,onOpenLibrary:i,onUploadSrtFile:a,pinnedSentencesCount:o=0,theme:s=`light`,onToggleTheme:c})=>{let[l,u]=(0,_.useState)(``),[d,f]=(0,_.useState)(``),[p,m]=(0,_.useState)(null),[h,g]=(0,_.useState)(!1),v=(0,_.useRef)(null),[b,x]=(0,_.useState)(!1),S=(0,_.useRef)(null);(0,_.useEffect)(()=>{if(!b)return;let e=e=>{S.current&&!S.current.contains(e.target)&&x(!1)};return document.addEventListener(`mousedown`,e),()=>document.removeEventListener(`mousedown`,e)},[b]);let C=s===`light`;return(0,_.useEffect)(()=>{let e=e=>{e.preventDefault(),m(e),g(!0)};return window.addEventListener(`beforeinstallprompt`,e),()=>window.removeEventListener(`beforeinstallprompt`,e)},[]),(0,U.jsx)(`header`,{className:`sticky top-0 z-40 backdrop-blur-md border-b transition-all h-12 flex items-center shadow-xs select-none ${C?`bg-white/95 border-slate-200 text-slate-800`:`bg-slate-900/95 border-slate-800 text-white`}`,children:(0,U.jsxs)(`div`,{className:`max-w-[1700px] w-full mx-auto px-3 flex items-center justify-between gap-3`,children:[(0,U.jsxs)(`div`,{className:`flex items-center gap-2.5 shrink-0`,children:[(0,U.jsx)(`div`,{className:`w-8 h-8 rounded-xl bg-gradient-to-tr from-rose-500 via-rose-600 to-indigo-600 flex items-center justify-center shadow-md shadow-rose-500/20 shrink-0`,children:(0,U.jsx)(Le,{className:`w-4 h-4 text-white fill-white ml-0.5`})}),(0,U.jsxs)(`div`,{className:`flex flex-col`,children:[(0,U.jsx)(`div`,{className:`flex items-center gap-1.5 flex-wrap`,children:(0,U.jsxs)(`span`,{className:`font-black text-sm tracking-tight leading-none ${C?`text-slate-900`:`bg-gradient-to-r from-amber-200 via-rose-200 to-indigo-200 bg-clip-text text-transparent`}`,children:[`PolyTube `,(0,U.jsx)(`span`,{className:`text-rose-500 font-arabic`,children:`العربية`})]})}),(0,U.jsx)(`span`,{className:`text-[10px] text-slate-500 dark:text-slate-400 font-medium hidden sm:inline mt-0.5`,children:`
