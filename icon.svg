<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="110" fill="url(#grad)"/>
  <!-- Decorative subtle circle -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="8"/>
  <!-- Stylized Play Button & Arabic Calligraphic Crescent -->
  <path d="M210 160 L360 256 L210 352 Z" fill="#ffffff" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.3))"/>
  <!-- Arabic Harakat / Diacritic Accent Symbol (Fatha / Tashkeel badge) -->
  <path d="M290 130 Q330 110 370 135" fill="none" stroke="url(#gold)" stroke-width="18" stroke-linecap="round"/>
  <!-- Subtitle Badge Indicator -->
  <rect x="156" y="380" width="200" height="34" rx="17" fill="rgba(0,0,0,0.4)"/>
  <rect x="180" y="392" width="60" height="10" rx="5" fill="#fde047"/>
  <rect x="250" y="392" width="80" height="10" rx="5" fill="#ffffff"/>
</svg>
