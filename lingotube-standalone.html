نْ ١٠٠ جِنْسِيَّةٍ حَوْلَ العَالَمِ!`,vocalizedText:`وَفَجْأَةً يُصْبِحُ عَدَدُ سُكَّانِهَا ٢ مِلْيُونِ نَسَمَةٍ مِنْ أَكْثَرَ مِنْ ١٠٠ جِنْسِيَّةٍ حَوْلَ الْعَالَمِ`,transliteration:`wa faj’atan yusbihu ‘adadu sukkānihā 2 milyūni nasamah min akthara min 100 jinsiyyah hawlal-‘ālam!`,translation:`And suddenly, it becomes home to 2 million people from over 100 nationalities around the globe!`,notes:`Sudden demographic arrival on the Day of Arafat.`,rootWords:[{word:`فجأة`,root:`ف-ج-أ`,meaning:`suddenly`},{word:`نسمة`,root:`ن-س-م`,meaning:`souls/inhabitants`},{word:`جنسية`,root:`ج-ن-س`,meaning:`nationality`}]},{id:3,start:28.9,end:37.9,text:`يَرْجِعُ عَدَدُ السُّكَّانِ صِفْر خِلاَلَ ١٢ سَاعَة فَقَطْ، إِحْنَا هُنَا فِي عَرَفَة وَجَبَلِ الرَّحْمَة.`,vocalizedText:`يَرْجِعُ عَدَدُ السُّكَّانِ صِفْرَ خِلَاَلَ ١٢ سَاعَةً فَقَطْ ، إِِْحْنََا هُنََا فِِي عَرَفَةً وَجَبَلِ الرَّحْمَةِ`,transliteration:`yarji‘ ‘adadu sukkān sifr khilāla 12 sā‘ah faqat, ihna hunā fī ‘arafah wa jabal ar-rahmah.`,translation:`And suddenly, the population returns to zero in just 12 hours. We are right here in Arafat and Mount Mercy.`,notes:`Ahmad Al-Shugairi standing on Mount Mercy.`,rootWords:[{word:`يرجع`,root:`ر-ج-ع`,meaning:`returns`},{word:`خلال`,root:`خ-ل-ل`,meaning:`within/during`},{word:`عرفة`,root:`ع-ر-ف`,meaning:`Arafat`}]},{id:4,start:38,end:45.2,text:`حَجّ مَبْرُور يَا حَجَّة، وَالنِّعْمِ فِيكُمْ وَالله... دَعَوَاتِكِ!`,vocalizedText:`حَجُّ مَبْرُورُ يَا حَجَّةٍ ، وَالنُّعْمِ فِيكُمْ وَاللهَ ... دَعَوَاتِكِ`,transliteration:`hajj mabrūr yā hajja, wan-ni‘mi fīkum wallah... da‘awātik!`,translation:`May your Hajj be blessed and accepted, dear pilgrim! Please remember us in your prayers!`,notes:`Spontaneous warm exchange with an elderly pilgrim.`,rootWords:[{word:`مبرور`,root:`ب-ر-ر`,meaning:`accepted`},{word:`دعواتك`,root:`د-ع-و`,meaning:`your prayers`}]},{id:5,start:45.8,end:53,text:`قَبْلَ لاَ نَبْدَأَ، خَلِّينَا نَرْجِعْ بِالزَّمَنِ لِلْوَرَا وَنَشُوفْ أَعْدَادَ الحُجَّاجِ عَبْرَ التَّارِيخِ.`,vocalizedText:`قَبْلَ لَا نَبْدَأَ ، خَلِّينَا نَرْجِعْ بِالزَّمَنِ لِلْوَرَا وَنَشُوفْ أَعْدَادَ الْحُجَّاجِ عَبْرَ التَّارِيخِ`,transliteration:`qabla lā nabda’, khallīnā narji‘ biz-zamani lil-warā wa nashūf a‘dādal-hujjāj ‘abrat-tārīkh.`,translation:`Before we begin, let’s go back in time and look at the number of pilgrims throughout history.`,notes:`Transition into the historical overview.`,rootWords:[{word:`نبدأ`,root:`ب-د-أ`,meaning:`we start`},{word:`الزمن`,root:`ز-م-ن`,meaning:`time`},{word:`التاريخ`,root:`أ-ر-خ`,meaning:`history`}]},{id:6,start:53,end:60.4,text:`حَنَلاَقِي إِنَّهُ الأَعْدَادُ مَا كَانَتْ تَتَجَاوَزُ عَشَرَاتِ الآلاَفِ كُلَّ سَنَةٍ، فَكَانَتِ الأُمُورُ سَهْلَةً وَإِدَارَتُهُمْ بَسِيطَةً.`,vocalizedText:`حَنَلاَقِي إِِْنّهُ الْأَعْدَادُ مَا كَانَتْ تَتَجَاوَزُ عَشَرَاتِ الْآلَاَفِ كُلّ سَنَةٍ ، فَكَانَتِ الْأُمُورُ سَهْلَةً وَإِدَارَتُهُمْ بَسيطَةً`,transliteration:`hanalāqī innahul-a‘dādu mā kānat tatajāwazu ‘asharātil-ālāf kulla sanah, fakānatil-umūru sahlatun wa idāratuhum basītah.`,translation:`We’ll find that the numbers did not exceed tens of thousands each year, so things were easy and managing them was simple.`,notes:`Early 20th century manageable scale.`,rootWords:[{word:`تتجاوز`,root:`ج-و-ز`,meaning:`exceeds`},{word:`عشرات`,root:`ع-ش-ر`,meaning:`tens`},{word:`إدارة`,root:`د-و-ر`,meaning:`management`}]},{id:7,start:60.4,end:68,text:`لِدَرَجَةِ إِنَّهُ جَرِيدَةُ المَدِينَةِ أَعْلَنَتْ سَنَةَ ١٩٦٤ أَكْبَرَ حَجٍّ فِي تَارِيخِ المَمْلَكَةِ! تَخَيَّلُوا كَمْ تَتَوَقَّعُوا كَانَتِ الأَعْدَادُ؟`,vocalizedText:`لِدَرَجَةِ إِِْنّهُ جَرِيدَةُ الْمَدِينَةِ أَعْلَنَتْ سَنَةَ ١٩٦٤ أَكْبَرَ حَجُّ فِِي تَارِيخِ الْمَمْلَكَةِتَخَيَّلُوا كَمْ تَتَوَقَّعُوا كَانَتِ الْأَعْدَادُ ؟`,transliteration:`lidarajati innahū jarīdatul-madīnah a‘lanat sanata 1964 akbara hajjin fī tārīkhil-mamlakah! takhayyalū kam tatawaqqa‘ū kānatil-a‘dād?`,translation:`To the extent that Al-Madina Newspaper announced in 1964 the biggest Hajj in the Kingdom’s history — imagine that, how many people do you think there were?`,notes:`Historical headline from 1964.`,rootWords:[{word:`جريدة`,root:`ج-ر-د`,meaning:`newspaper`},{word:`تاريخ`,root:`أ-ر-خ`,meaning:`history`},{word:`تخيلوا`,root:`خ-ي-ل`,meaning:`imagine`}]},{id:8,start:68,end:75.2,text:`١٢٨ أَلْفَ حَاجٍّ فَقَطْ! وَبَعْدَهَا مَعَ سُهُولَةِ السَّفَرِ وَالتِّقْنِيَةِ زَادَتِ الأَعْدَادُ سَنَةً بَعْدَ سَنَةٍ.`,vocalizedText:`١٢٨ ألْفَ حَاجِّ فَقَطْوَبَعْدَهَا مَعَّ سُهولَةِ السَّفَرِ وَالتِّقْنِيَّةِ زَادَتْ الْأَعْدَادُ سَنَةً بَعْدَ سَنَةٍ`,transliteration:`128 alfa hājj faqat! wa ba‘dahā ma‘a suhūlatis-safari wat-tiqniyah zādatil-a‘dādu sanatan ba‘da sanah.`,translation:`Only 128,000 pilgrims! After that, with easier travel and technology, the numbers increased year after year.`,notes:`1964 benchmark figure.`,rootWords:[{word:`ألف`,root:`أ-ل-ف`,meaning:`thousand`},{word:`فقط`,root:`ف-ق-ط`,meaning:`only`},{word:`السفر`,root:`س-ف-ر`,meaning:`travel`}]},{id:9,start:75.2,end:81.9,text:`وَأَوَّلُ سَنَةٍ يَوْصَلُ فِيهَا عَدَدُ الحُجَّاجِ لِمِلْيُونِ حَاجٍّ كَانَ سَنَةَ ١٩٧٩ لأَوَّلِ مَرَّةٍ فِي التَّارِيخِ.`,vocalizedText:`وَأَوَّلُ سَنَةٍ يَوْصَلُ فِيهَا عَدَدُ الْحُجَّاجِ لِمِلْيُونِ حَاجِّ كَانَ سَنَةَ ١٩٧٩ لِأَوَّلِ مَرَّةٍ فِِي التَّارِيخِ`,transliteration:`wa awwalu sanatin yawsalu fīhā ‘adadul-hujjāj li-milyūni hājj kāna sanata 1979 li-awwali marratin fīt-tārīkh.`,translation:`And the first year the number of pilgrims reached one million was in 1979, for the first time in history.`,notes:`The one-million milestone.`,rootWords:[{word:`أول`,root:`أ-و-ل`,meaning:`first`},{word:`يوصل`,root:`و-ص-ل`,meaning:`reaches`},{word:`مليون`,root:`م-ل-ي-ن`,meaning:`million`}]},{id:10,start:81.9,end:87.6,text:`وَبَعْدَهَا بِـ ١٦ سَنَةً فَقَطْ وَصَلُوا الحُجَّاجُ إِلَى ٢ مِلْيُونِ حَاجٍّ!`,vocalizedText:`وَبَعْدَهَا بِ ١٦ سَنَةً فَقَطْ وَصَلُوا الْحُجَّاجُ إِِْلََى ٢ مِلْيُونِ حَاجٍّ`,transliteration:`wa ba‘dahā bi-16 sanatan faqat wasalūl-hujjāju ilā 2 milyūni hājj!`,translation:`And just 16 years later, the number of pilgrims reached 2 million!`,notes:`Rapid escalation between 1979 and 1995.`,rootWords:[{word:`سنة`,root:`س-ن-و`,meaning:`year`},{word:`وصلوا`,root:`و-ص-ل`,meaning:`they reached`}]},{id:11,start:87.6,end:93.6,text:`يَعْنِي ٤٠ ضِعْفَ الأَعْدَادِ الَّتِي كَانَتْ تَرُوحُ الحَجَّ فِي المَاضِي!`,vocalizedText:`يَعْنِي ٤٠ ضِعْفَ الْأَعْدَادِ الَّتِي كَانَتْ تَرُوحُ الْحَجُّ فِِي الْمَاضِي`,transliteration:`ya‘nī 40 di‘fal-a‘dādil-latī kānat tarūhul-hajja fīl-mādī!`,translation:`That’s forty times the number of people who used to perform Hajj in the past!`,notes:`40x multiplier graphic on screen.`,rootWords:[{word:`ضعف`,root:`ض-ع-ف`,meaning:`fold / multiple`},{word:`تروح`,root:`ر-و-ح`,meaning:`goes`},{word:`الماضي`,root:`م-ض-ي`,meaning:`past`}]},{id:12,start:99.7,end:106.6,text:`اليَوْم، عَرَفَة، السَّاعَةُ ٧ الصَّبَاح بَدَأُوا.`,vocalizedText:`الْيَوْمُ ، عَرَفَةً ، السَّاعَةُ ٧ الصَّبَاحَ بَدَأُوا`,transliteration:`al-yawm, ‘arafah, as-sā‘atu 7 as-sabāh bada’ū.`,translation:`Today, Day of Arafat, 7:00 AM, they have begun.`,notes:`Verbatim spoken dialogue at 01:45 matching YouTube player CC caption.`,rootWords:[{word:`اليوم`,root:`ي-و-م`,meaning:`today`},{word:`الساعة`,root:`س-و-ع`,meaning:`hour/time`},{word:`بدأوا`,root:`ب-د-أ`,meaning:`they started`}]},{id:13,start:106.6,end:114.4,text:`الحُجَّاجُ يَوْصَلُوا إِلَى عَرَفَةَ مِنْ مِنَى، كَيْفَ بِتَتِمُّ إِدَارَةُ هَذِهِ الحُشُودِ الضَّخْمَةِ؟ مِنْ هُنَا: مَرْكَزُ القِيَادَةِ وَالسَّيْطَرَةِ.`,vocalizedText:`الْحُجَّاجُ يَوْصَلُوا إِِْلََى عَرَفَةَ مِنْ مِنََى ، كَيْفَ بِتَتِمّ إِدَارَةُ هَذِهِ الْحُشُودِ الضَّخْمَةِ ؟ مِنْ هُنََامَرْكَزُ الْقِيَادَةِ وَالسَّيْطَرَةِ`,transliteration:`al-hujjāju yawsalū ilā ‘arafata min minā, kayfa bitatimmu idāratu hādhihil-hushūdid-dakhmah? min hunā: markazul-qiyādati was-saytarah.`,translation:`The pilgrims started arriving at Arafat from Mina. How is this massive crowd managed? From right here: The Command and Control Center.`,notes:`Inside the massive operations room.`,rootWords:[{word:`إدارة`,root:`د-و-ر`,meaning:`management`},{word:`الحشود`,root:`ح-ش-د`,meaning:`crowds`},{word:`القيادة`,root:`ق-و-د`,meaning:`command`}]},{id:14,start:114.4,end:120.1,text:`حَيَّ اللهُ دُكْتُور، يَعْطِيكَ العَافِيَة، إِيشْ أَكْبَرُ التَّحَدِّيَاتِ فِي مِنَى؟`,vocalizedText:`حَيُّ اللهُ دُكْتورٍ ، يَعْطِيكَ الْعَافِيَةَ ، إِيشْ أكْبَرُ التَّحَدِّيَاتِ فِِي مِنََى ؟`,transliteration:`hayyallāhu duktūr, ya‘tīkal-‘āfiyah, ēsh akbarut-tahaddiyāti fī minā?`,translation:`Welcome, doctor. May God grant you strength! What are the biggest challenges in Mina?`,notes:`Ahmad Al-Shugairi interviewing the operations director.`,rootWords:[{word:`العافية`,root:`ع-ف-ي`,meaning:`well-being`},{word:`التحديات`,root:`ح-د-ي`,meaning:`challenges`}]},{id:15,start:120.1,end:126.2,text:`التَّحَدِّي فِي مِنَى: لَهَا حُدُودٌ شَرْعِيَّةٌ مُحَدَّدَةٌ، مَكَانٌ مَحْصُورٌ مَا تَقْدِرْ تُوَسِّعْ!`,vocalizedText:`التَّحَدِّي فِِي مِنََىلَهَا حُدودٌ شَرْعِيَّةٌ مُحَدَّدَةٌ ، مَكَانٌ مَحْصُورٌ مَا تَقْدِرْ تُوَسِّعْ`,transliteration:`at-tahaddī fī minā: lahā hudūdun shar‘iyyatun muhaddadah, makānun mahsūrun mā tiqdir tuwassi‘!`,translation:`The challenge in Mina is that it has specific canonical boundaries—it’s a confined space that cannot be expanded!`,notes:`The central engineering constraint of Hajj.`,rootWords:[{word:`حدود`,root:`ح-د-د`,meaning:`borders/limits`},{word:`شرعية`,root:`ش-ر-ع`,meaning:`canonical/legal`},{word:`محصور`,root:`ح-ص-ر`,meaning:`confined`}]},{id:16,start:126.2,end:132,text:`تَسْتَقْبِلُ ٢ مِلْيُونِ خِلاَلَ ٢٤ سَاعَةً فَجْأَةً!`,vocalizedText:`تَسْتَقْبِلُ ٢ مِلْيُونِ خِلَاَلَ ٢٤ سَاعَةً فَجْأَةً`,transliteration:`tastaqbilu 2 milyūn khilāla 24 sā‘atan faj’ah!`,translation:`You have to accommodate 2 million people within just 24 hours all of a sudden!`,notes:`Extreme demographic surge.`,rootWords:[{word:`تستقبل`,root:`ق-ب-ل`,meaning:`receives`},{word:`خلال`,root:`خ-ل-ل`,meaning:`within`},{word:`فجأة`,root:`ف-ج-أ`,meaning:`suddenly`}]},{id:17,start:132,end:138.4,text:`عَشَانْ أَدِّيكُمْ فِكْرَةً عَنِ الكَثَافَةِ: أَكْثَرُ المُدُنِ كَثَافَةً فِي العَالَمِ مَانِيلاَ فِي الفِلِبِّين فِيهَا تَقْرِيباً ٤٠ أَلْفَ إِنْسَانٍ لِكُلِّ كِيلُومِتْرٍ مُرَبَّعٍ.`,vocalizedText:`عَشَانْ أَدِّيكُمْ فِكْرَةً عَنِّ الْكَثَافَةِأَكْثَرُ الْمُدُنِ كَثَافَةً فِِي الْعَالَمِ مَانِيلَا فِِي الفِلِبِّين فِيهَا تَقْريبًا ٤٠ ألْفَ إِنْسَانٍ لِكُلّ كِيلُومِترٍ مُرَبَّعٍ`,transliteration:`‘ashān addīkum fikrah ‘anil-kithāfah: aktharul-muduni kithāfatan fīl-‘ālam mānīlā fīl-filibbīn fīhā taqrīban 40 alfa insānin likulli kīlūmitrin murabba‘.`,translation:`Just to give you an idea of the density: The most densely populated city in the world, Manila in the Philippines, has around 40,000 people per square kilometer.`,notes:`Benchmark density comparison.`,rootWords:[{word:`الكثافة`,root:`ك-ث-ف`,meaning:`density`},{word:`تقريباً`,root:`ق-ر-ب`,meaning:`approximately`},{word:`إنسان`,root:`أ-ن-س`,meaning:`person`}]},{id:18,start:138.4,end:145.4,text:`مَكَانٌ ثَانٍ فِيهِ تَجَمُّعَاتٌ أَكْثَرَ حَتَّى مِنَ المُدُنِ، زَيِّ دِيزْنِي لاَنْد مَثَلاً، الكَثَافَةُ السُّكَّانِيَّةُ حَقَّتُهُ ١١٦ أَلْفَ شَخْصٍ لِكُلِّ كِيلُومِتْرٍ مُرَبَّعٍ.`,vocalizedText:`مَكَانٌ ثَانٍ فِيهِ تَجَمُّعَاتٌ أَكْثَرَ حَتَّى مِنَ الْمُدُنِ ، زَيِّ دِيزْنِي لاَنْد مَثَلًا ، الْكَثَافَةُ السُّكَّانِيَّةُ حَقَّتُهُ ١١٦ ألْفَ شَخْصٍ لِكُلّ كِيلُومِترٍ مُرَبَّعٍ`,transliteration:`makānun thānin fīhi tajammu‘ātun akthara hattā minal-mudun, zayye dīznī lānd mathalan, al-kithāfatus-sukkāniyyatu haqqatuhū 116 alfa shakhsin likulli kīlūmitrin murabba‘.`,translation:`Another place with even bigger crowds than cities, like Disneyland for example, its population density reaches 116,000 people per square kilometer.`,notes:`Disneyland comparison.`,rootWords:[{word:`تجمعات`,root:`ج-م-ع`,meaning:`gatherings/crowds`},{word:`السكانية`,root:`س-ك-ن`,meaning:`population`}]},{id:19,start:145.4,end:154.7,text:`مَشْعَرُ مِنَى نَتَكَلَّمُ عَلَى مِلْيُونِ شَخْصٍ لِكُلِّ كِيلُومِتْرٍ مُرَبَّعٍ! يَعْنِي ١٠ أَضْعَافِ الكَثَافَةِ الَّتِي تَحْصُلُ فِي دِيزْنِي لاَنْد.`,vocalizedText:`مَشْعَرُ مِنََى نَتَكَلَّمُ عَلَّى مِلْيُونُ شَخْصٍ لِكُلّ كِيلُومِترٍ مُرَبَّعٍيَعْنِي ١٠ أَضْعَافِ الْكَثَافَةِ الَّتِي تَحْصُلُ فِِي دِيزْنِي لاَنْد`,transliteration:`mash‘aru minā natakallamu ‘alā milyūni shakhsin likulli kīlūmitrin murabba‘! ya‘nī 10 ad‘āfil-kithāfatil-latī tahsulu fī dīznī lānd.`,translation:`In Mina, we are talking about ONE MILLION people per square kilometer! That’s 10 times the density of Disneyland!`,notes:`Mina density metric: 1,000,000 / km².`,rootWords:[{word:`مشعر`,root:`ش-ع-ر`,meaning:`ritual sanctuary`},{word:`أضعاف`,root:`ض-ع-ف`,meaning:`multiples`}]},{id:20,start:154.7,end:162,text:`وَ١٥ أَوْ ٢٠ ضِعْفَ أَكْثَفِ المُدُنِ فِي العَالَمِ! هَذِهِ الكَثَافَةُ تُؤَدِّي إِلَى تَحَدِّيَاتٍ كَبِيرَةٍ.`,vocalizedText:`وَ١٥ أَوْ ٢٠ ضِعْفَ أَْكْثَفِ الْمُدُنِ فِِي الْعَالَمِهَذِهِ الْكَثَافَةُ تُؤَدِّي إِِْلََى تَحَدِّيَاتٍ كَبِيرَةٍ`,transliteration:`wa 15 aw 20 di‘fa akthafil-muduni fīl-‘ālam! hādhihil-kithāfatu tu’addī ilā tahaddiyātin kabīrah.`,translation:`And 15 to 20 times the densest cities in the world! This extreme density leads to immense logistical challenges.`,notes:`The core challenge statement.`,rootWords:[{word:`تحديات`,root:`ح-د-ي`,meaning:`challenges`},{word:`تؤدي`,root:`أ-د-ي`,meaning:`leads to`}]},{id:21,start:162,end:168.9,text:`تَحَدِّي تَحَرُّكَاتِهِمْ، تَحَدِّي رِعَايَتِهِمُ الصِّحِّيَّةِ، وَتَحَدِّي الخِدْمَاتِ الَّتِي تُقَدَّمُ لَهُمْ.`,vocalizedText:`تَحَدَّيْ تَحَرُّكَاتِهِمْ ، تَحَدَّيْ رِعَايَتِهِمُ الصِّحِّيَّةِ ، وَتَحَدَّيْ الْخِدْمَاتِ الَّتِي تُقَدِّمُ لَهُمْ`,transliteration:`tahaddī taharrukātihim, tahaddī ri‘āyatihimus-sihhiyyah, wa tahaddīl-khidmātil-latī tuqaddamu lahum.`,translation:`The challenge of their movement, the challenge of healthcare, and the challenge of all public services provided to them.`,notes:`Trio of core operational challenges.`,rootWords:[{word:`تحركاتهم`,root:`ح-ر-ك`,meaning:`their movements`},{word:`الصحية`,root:`ص-ح-ح`,meaning:`health`},{word:`الخدمات`,root:`خ-د-م`,meaning:`services`}]},{id:22,start:168.9,end:175.4,text:`المَايَةُ، الحَمَّامَاتُ، الإِقَامَةُ... تَحَدِّيَاتٌ كَبِيرَةٌ جَايَةٌ مِنَ الكَثَافَةِ الشَّدِيدَةِ.`,vocalizedText:`الْمَاِيَّةُ ، الْحَمَّامَاتُ ، الْإقَامَةُ ... تَحَدِّيَاتٌ كَبِيرَةٌ جَايَةٌ مِنَ الْكَثَافَةِ الشَّدِيدَةِ`,transliteration:`al-māyah, al-hammāmāt, al-iqāmah... tahaddiyātun kabīratun jāyah minal-kithāfatish-shadīdah.`,translation:`Water supply, toilets, housing... massive challenges arising from this extreme density.`,notes:`Basic infrastructure demands.`,rootWords:[{word:`الإقامة`,root:`ق-و-م`,meaning:`accommodation`},{word:`الشديدة`,root:`ش-د-د`,meaning:`intense`}]},{id:23,start:175.4,end:181.4,text:`إِحْنَا نُنْشِئُ مُدُناً خِدْمِيَّةً، وَنُحَرِّكُ مَدِينَةً كَامِلَةً فِي اليَوْمِ ثَلاَثَ أَوْ أَرْبَعَ مَرَّاتٍ!`,vocalizedText:`إِِْحْنََا نُنْشِئُ مُدُّنَا خِدْمِيَّةً ، وَنُحَرِّكُ مَدِينَةً كَامِلَةً فِِي الْيَوْمِ ثَلاث أَوْ أَرْبَعُ مَرَّاتٍ`,transliteration:`ihna nunshi’u mudunan khidmiyyah, wa nuharriku madīnatan kāmilatan fīl-yawmi thalātha aw arba‘a marrāt!`,translation:`We build entire service cities from scratch, and we move an entire city three or four times in a single day!`,notes:`The city that moves multiple times daily.`,rootWords:[{word:`ننشئ`,root:`ن-ش-أ`,meaning:`we create`},{word:`نحرك`,root:`ح-ر-ك`,meaning:`we move`},{word:`مدينة`,root:`م-د-ن`,meaning:`city`}]},{id:24,start:181.4,end:187.6,text:`مِنْ عَرَفَةَ إِلَى مُزْدَلِفَةَ، وَمِنْ مُزْدَلِفَةَ إِلَى مِنَى، وَمِنْ مِنَى إِلَى الحَرَمِ: نُحَرِّكُ مَدِينَةً كُلَّ ٦ أَوْ ٧ سَاعَاتٍ!`,vocalizedText:`مِنْ عَرَفَةَ إِِْلََى مُزْدَلِفَةَ ، وَمِنْ مُزْدَلِفَةَ إِِْلََى مِنََى ، وَمِنْ مِنََى إِِْلََى الْحَرَمِنُحَرِّكُ مَدِينَةً كُلّ ٦ أَوْ ٧ سَاعَاتٍ`,transliteration:`min ‘arafata ilā muzdalifah, wa min muzdalifata ilā minā, wa min minā ilal-haram: nuharriku madīnatan kulla 6 aw 7 sā‘āt!`,translation:`From Arafat to Muzdalifah, from Muzdalifah to Mina, and from Mina to the Grand Mosque: we move an entire city every 6 to 7 hours!`,notes:`The complete movement sequence across holy sites.`,rootWords:[{word:`مزدلفة`,root:`ز-ل-ف`,meaning:`Muzdalifah`},{word:`الحرم`,root:`ح-ر-م`,meaning:`the sanctuary`},{word:`ساعات`,root:`س-و-ع`,meaning:`hours`}]},{id:25,start:187.6,end:198.8,text:`إِحْنَا هُنَا بِنَتَكَلَّمُ عَلَى أَكْثَرَ مِنْ ١٠٠ جِنْسِيَّةٍ جَايَةٍ مِنْ كُلِّ فَجٍّ عَمِيقٍ.`,vocalizedText:`إِِْحْنََا هُنََا بِنَتَكَلّمُ عَلَى أَكْثَرَ مِنْ ١٠٠ جِنْسِيَّةٍ جَايَةٍ مِنْ كُلّ فَجٍّ عَمِيقٍ`,transliteration:`ihna hunā binatakallamu ‘alā akthara min 100 jinsiyyatin jāyah min kulli fajjin ‘amīq.`,translation:`Here we are talking about more than 100 nationalities coming from every distant mountain highway.`,notes:`Echoing the Quranic verse: "من كل فج عميق".`,rootWords:[{word:`جنسية`,root:`ج-ن-س`,meaning:`nationality`},{word:`عميق`,root:`ع-م-ق`,meaning:`deep/distant`}]},{id:26,start:198.8,end:210.4,text:`أَنَا مِنَ الأُرْدُنِ! أَهْلاً بِأَهْلِ الزَّرْقَاءِ، أَهْلاً بِمِصْرَ، الهِنْدِ، بَاكِسْتَانَ، كُرْدِسْتَانَ، مَاشَاءَ اللهُ، هَلاَ بِاليَمَنِ السَّعِيدِ!`,vocalizedText:`أَْنََا مِنَ الْأُرْدُنِأهْلًا بِأهْلِ الزَّرْقَاءِ ، أهْلًا بِمِصْرَ ، الْهِنْدِ ، بَاكِسْتَانَ ، كُرْدِسْتَانَ ، مَاشَاءَ اللهُ ، هَلًّا بِالْيَمَنِ السَّعِيدِ`,transliteration:`anā minal-urdun! ahlan bi-ahliz-zarqā’, ahlan bi-misr, al-hind, bākistān, kurdistān, māshā’allāh, halā bil-yamanis-sa‘īd!`,translation:`“I’m from Jordan!” Welcome people of Zarqa! Welcome Egypt, India, Pakistan, Kurdistan, and welcome blessed Yemen!`,notes:`Ahmad Al-Shugairi speaking with international pilgrims on the ground.`,rootWords:[{word:`الأردن`,root:`أ-ر-د-ن`,meaning:`Jordan`},{word:`الهند`,root:`ه-ن-د`,meaning:`India`},{word:`اليمن`,root:`ي-م-ن`,meaning:`Yemen`}]},{id:27,start:210.4,end:221.8,text:`وَفِي عَرَفَاتَ يُقَالُ إِنَّ وَاحِدَةً مِنْ أَسْبَابِ اسْمِ عَرَفَاتٍ هِيَ فِكْرَةُ «التَّعَارُفِ»، مَبْدَأُ ﴿وَجَعَلْنَاكُمْ شُعُوباً وَقَبَائِلَ لِتَعَارَفُوا﴾.`,vocalizedText:`وَفِّي عَرَفَاتَ يُقَالُ إِِْنّ وَاحِدَةً مِنْ أسْبَابِ اِسْمِ عَرَفَاتٍ هِي فِكْرَةُ « التَّعَارُفِ »، مَبْدَأُ ﴿ وَجَعَلْنَاكُمْ شُعُوباً وَقَبَائِلَ لِتَعَارَفُوا ﴾.`,transliteration:`wa fī ‘arafāta yuqālu inna wāhidatan min asbābismi ‘arafātin hiya fikratut-«ta‘āruf», mabda’u ﴿wa ja‘alnākum shu‘ūban wa qabā’ila lita‘ārafū﴾.`,translation:`And in Arafat, it is said that one of the reasons for its name is the concept of mutual acquaintance (Ta‘āruf): "so that you may know one another".`,notes:`Linguistic and spiritual origin of the name Arafat.`,rootWords:[{word:`عرفات`,root:`ع-ر-ف`,meaning:`Arafat`},{word:`التعارف`,root:`ع-ر-ف`,meaning:`mutual knowing`},{word:`شعوباً`,root:`ش-ع-ب`,meaning:`nations`}]},{id:28,start:221.8,end:235.6,text:`إِيشْ يَعْنِي تَتَعَرَّفْ عَلَيْهِ؟ يَعْنِي تَفْهَمْ مَبَادِئَهُ، تَفْهَمْ أَفْكَارَهُ، تَقَالِيدَهُ، أَكْلَهُ، عَادَاتِهِ... كُلُّ هَذَا يَنْدَرِجُ تَحْتَ مَفْهُومِ التَّعَارُفِ.`,vocalizedText:`إِيشْ يَعْنِي تَتَعَرَّفْ عَلَّيْهِ ؟ يَعْنِي تَفْهَمْ مَبَادِئَهُ ، تَفْهَمْ أَفْكَارَهُ ، تَقَالِيدَهُ ، أَكْلَهُ ، عَادَاتِهِ ... كُلّ هَذَّا يَنْدَرِجُ تَحْتَ مَفْهُومِ التَّعَارُفِ`,transliteration:`ēsh ya‘nī tata‘arraf ‘alayh? ya‘nī tafham mabādi’ahū, tafham afkārahū, taqālīdahū, aklahū, ‘ādātihī... kullu hādhā yandariju tahta mafhūmit-ta‘āruf.`,translation:`What does "getting to know someone" mean? It means understanding their values, their thoughts, their traditions, their food, their habits—all of this falls under mutual acquaintance.`,notes:`Deep cultural reflection on intercultural communication.`,rootWords:[{word:`تتعرف`,root:`ع-ر-ف`,meaning:`to get to know`},{word:`مبادئه`,root:`ب-د-أ`,meaning:`principles`},{word:`عاداته`,root:`ع-و-د`,meaning:`customs`}]},{id:29,start:235.6,end:244.6,text:`وَبِزِيَادَةِ التَّعَارُفِ يَزِيدُ التَّعَايُشُ السِّلْمِيُّ بَيْنَ البَشَرِ.`,vocalizedText:`وَبِزِيَادَةِ التَّعَارُفِ يَزِيدُ التَّعَايُشُ السَّلْمِيُّ بَيْنَ الْبَشَرِ`,transliteration:`wa bi-ziyādatit-ta‘ārufi yazīdut-ta‘āyushus-silmiyyu baynal-bashar.`,translation:`And with greater mutual understanding comes greater peaceful coexistence among all mankind.`,notes:`The core philosophical takeaway of the scene.`,rootWords:[{word:`بزيادة`,root:`ز-ي-د`,meaning:`increase`},{word:`التعايش`,root:`ع-ي-ش`,meaning:`coexistence`},{word:`البشر`,root:`ب-ش-ر`,meaning:`mankind`}]},{id:30,start:244.6,end:260,text:`عَلِّمْنِي كَلِمَةً مَغْرِبِيَّةً مَا أَعْرِفُهَا! «طَنْجِيَّة»... أَكْلَةٌ مَغْرِبِيَّةٌ بِالأَخَصِّ فِي مُرَّاكُش، طَنْجِيَّة مَرَّاكُشِيَّة!`,vocalizedText:`عَلِّمْنِي كَلِمَةً مَغْرِبِيَّةً مَا أَعْرِفُهَا !« طَنْجِيَّةَ »... أَكْلَةٌ مَغْرِبِيَّةٌ بِالْأَخَصِّ فِِي مُرَّاكُش ، طَنْجِيَّةَ مَرَّاكُشِيَّةٍ`,transliteration:`‘allimnī kalimatan maghribiyyatan mā a‘rifuhā! «tanjiyyah»... aklatun maghribiyyatun bil-akhassi fī murrākush, tanjiyyah marrākushiyyah!`,translation:`“Teach me a Moroccan word I don’t know!” — “Tanjia!” A traditional Moroccan slow-cooked clay pot dish, specifically from Marrakesh!`,notes:`Cultural culinary exchange with a Moroccan pilgrim.`,rootWords:[{word:`علمني`,root:`ع-ل-م`,meaning:`teach me`},{word:`كلمة`,root:`ك-ل-م`,meaning:`word`},{word:`مغربية`,root:`غ-ر-ب`,meaning:`Moroccan`}]},{id:31,start:260,end:266,text:`طنجيه المراكشيه يلا نجيكم مراكش تعزمنا علىيه حكيني ايش اكثر شي لف نظرك التنظيف`,vocalizedText:`طَنْجِيُّهُ المراكشيه يَلَّا نَجِيُّكُمْ مَرَّاكِشَ تعزمنَا علىيه حُكِّينِي ايش اُكْثُرْ شَيَّ لَفِّ نَظَرِكَ التَّنْظِيفَ`,transliteration:`tnjyh almrakshyh yla njykm mraksh t‘zmna ‘lāyh hkyny aysh akthr shy lf nzrk altnzyf`,translation:`Marrakesh-style Tanjia. Alright, we’ll come to Marrakesh and you’ll host us with Tanjia. Tell me — what impressed you the most? The organization.`,notes:`Ahmad Al-Shugairi Hajj Episode (Seen 3).`,rootWords:[]},{id:32,start:266,end:269.6,text:`تيسير على الحق`,vocalizedText:`تَيْسيرٌ عَلَى الْحَقِّ`,transliteration:`tysyr ‘lā alhq`,translation:`The organization. The organization. That’s the most important thing for you? How many cameras are we talking about?`,notes:`Ahmad Al-Shugairi Hajj Episode (Seen 3).`,rootWords:[]},{id:33,start:270.2,end:275.4,text:`كم كاميرا اكلم على اكثر من 8000 كاميرا بس في المشاعر بس المشاعر بنشوفها تحت بعد`,vocalizedText:`كَم كاميرا اِكْلِمْ عَلَى اُكْثُرْ مِن 8000 كاميرا بَسّ فِي الْمَشَاعِرِ بَسّ الْمَشَاعِرِ بنشوفها تَحْت بَعْد`,transliteration:`km kamyra aklm ‘lā akthr mn 8000 kamyra bs fy almsha‘r bs almsha‘r bnshwfha tht b‘d`,translation:`How many cameras are we talking about? More than 8,000 cameras. Just in the holy sites? Just in the holy sites. We’ll see them later when we talk about the buses.`,notes:`Ahmad Al-Shugairi Hajj Episode (Seen 3).`,rootWords:[{word:`بعد`,root:`ب-ع-د`,meaning:`After`}]},{id:34,start:275.4,end:280.8,text:`شوي في موضوع الحافلات هذه طبعا هذه`,vocalizedText:`شَوِيٌّ فِي مَوْضُوعُ الْحَافِلَاتِ هَذِه طَبْعَا هَذِه`,transliteration:`shwy fy mwdw‘ alhaflat hdhh tb‘a hdhh`,translation:`We’ll see them later when we talk about the buses. This, of course... This...`,notes:`Ahmad Al-Shugairi Hajj Episode (Seen 3).`,rootWords:[]},{id:35,start:281,end:287.8,text:`22244 حافله يعطيك اياها بالعدد الحافله ش الحافله وكم سرعتها وكل شي كل حافله كل`,vocalizedText:`22244 حَافِلَهُ يُعْطِيكَ اياها بِالْعَدَدِ الحافله ش الحافله وكَم سُرْعَتِهَا وكُلّ شَيٍّ كُلّ حَافِلِهِ كُلّ`,transliteration:`22244 haflh y‘tyk ayaha bal‘dd alhaflh sh alhaflh wkm sr‘tha wkl shy kl haflh kl`,translation:`22,244 buses. They give you the exact number. Each bus — what it is, how fast it is, everything. Every bus. Every bus.`,notes:`Ahmad Al-Shugairi Hajj Episode (Seen 3).`,rootWords:[{word:`كل`,root:`ك-ل-ل`,meaning:`Every`}]},{id:36,start:287.8,end:294.7,text:`حافله لدرجه كل حافله واقفه ولا متحركه متحركه كم سرعتها وكلها مربوطه بالاي اي`,vocalizedText:`حَافِلُهُ لِدَرَجَهُ كُلّ حَافِلِهِ وَاقِفِهِ ولَا مُتَحَرِّكِهِ مُتَحَرِّكِهِ كَم سُرْعَتِهَا وكُلّهَا مَرْبُوطَهُ بَالَاي اي`,transliteration:`haflh ldrjh kl haflh waqfh wla mthrkh mthrkh km sr‘tha wklha mrbwth balay ay`,translation:`Every bus. Every bus. To the point where they know if each bus is stationary or moving. If it’s moving, what its speed is. And all of it is connected to AI. Yes, that’s right.`,notes:`Ahmad Al-Shugairi Hajj Episode (Seen 3).`,rootWords:[{word:`كل`,root:`ك-ل-ل`,meaning:`Every`}]},{id:37,start:294.7,end:301.4,text:`نعم صحيح الف حافله كلها كلها متابعه انا انا دخت ايش تحدي عندكم في يوم عرفه`,vocalizedText:`نِعْم صَحِيحِ اُلْفُ حَافِلَهُ كُلّهَا كُلّهَا مُتَابِعَهُ انا انا دُخْتُ ايش تَحُدِّي عِنْدكُمْ فِي يَوْمِ عُرْفِهِ`,transliteration:`n‘m shyh alf haflh klha klha mtab‘h ana ana dkht aysh thdy ‘ndkm fy ywm ‘rfh`,translation:`Yes, that’s right. The 20,000 buses... All are being monitored. I’m getting dizzy. What’s the challenge you face on the Day of Arafat? The challenge in Arafat...`,notes:`Ahmad Al-Shugairi Hajj Episode (Seen 3).`,rootWords:[{word:`يوم`,root:`ي-و-م`,meaning:`Day`}]},{id:38,start:301.4,end:308.5,text:`التحدي في عرفه ان هذا هذا الجمع كامل 2 مليون في نطاق زمني محدود خمس ساعات ينتقل`,vocalizedText:`التَّحَدِّي فِي عُرْفِهِ انَّ هَذَا هَذَا الْجَمْعُ كَامِلُ 2 مِلْيُونُ فِي نِطَاقِ زَمَنِيِّ مَحْدُودِ خُمُسِ سَاعَاتٍ يَنْتَقِلُ`,transliteration:`althdy fy ‘rfh an hdha hdha aljm‘ kaml 2 mlywn fy ntaq zmny mhdwd khms sa‘at yntql`,translation:`The challenge in Arafat... Is that this entire gathering of 2 million... ...must move within a limited timeframe of 5 hours... ...to Muzdalifah.`,notes:`Ahmad Al-Shugairi Hajj Episode (Seen 3).`,rootWords:[{word:`مليون`,root:`م-ل-ي-ن`,meaning:`Million (1,000,000)`}]},{id:39,start:308.5,end:315.2,text:`الى مزدلفه كلهم لازم فور روح يطلعوا الى مزدلفه هذه محطات القطار تنقل 320 هذا`,vocalizedText:`الى مزدلفه كُلّهُمْ لَازِمِ فَوْرِ رَوْحِ يَطَّلِعُوا الى مزدلفه هَذِه مَحَطَّاتِ الْقِطَارِ تَنْقُلُ 320 هَذَا`,transliteration:`alā mzdlfh klhm lazm fwr rwh ytl‘wa alā mzdlfh hdhh mhtat alqtar tnql 320 hdha`,translation:`...to Muzdalifah. Do all of them have to go by bus? They go up to Muzdalifah. These train stations move 320,000. Traditional transport moves 800,000 pilgrims.`,notes:`Ahmad Al-Shugairi Hajj Episode (Seen 3).`,rootWords:[]},{id:40,start:315.2,end:321.5,text:`النقل التقليدي وينقل 80000000 حاج وهنا النقل الترددي ينقل 750 الف حاج ايش النقل`,vocalizedText:`النَّقْلُ التَّقْليدِيُّ وَيَنْقُلُ 80000000 حَاجٍّ وهُنَا النَّقْلِ التَّرَدُّدِيِّ يَنْقُلُ 750 اُلْفُ حَاجَّ ايش النَّقْلَ`,transliteration:`alnql altqlydy wynql 80000000 haj whna alnql altrddy ynql 750 alf haj aysh alnql`,translation:`Traditional transport moves 800,000 pilgrims. And this shuttle transport moves 750,000 pilgrims. What do you mean by shuttle transport?`,notes:`Ahmad Al-Shugairi Hajj Episode (Seen 3).`,rootWords:[{word:`حاج`,root:`ح-ج-ج`,meaning:`Pilgrim`}]},{id:41,start:321.5,end:327.4,text:`الترددي المخ النقل الترددي شتل ال باص الشل بس يعني يعطي اكثر من رد تمام يفضل`,vocalizedText:`التَّرَدُّدِيُّ اِلْمَخْ النَّقْلَ التَّرَدُّدِيَّ شَتَلَ الُ بَاصِ الشُّلِّ بَسّ يَعْنِي يُعْطِي اُكْثُرْ مِن رُدْ تَمَامَ يُفْضِلُ`,transliteration:`altrddy almkh alnql altrddy shtl al bas alshl bs y‘ny y‘ty akthr mn rd tmam yfdl`,translation:`What do you mean by shuttle transport? Shuttle bus transport. Shuttle bus. That makes multiple trips. Exactly — back and forth.`,notes:`Ahmad Al-Shugairi Hajj Episode (Seen 3).`,rootWords:[{word:`يعني`,root:`ع-ن-ي`,meaning:`Meaning`}]},{id:42,start:327.4,end:332.5,text:`يروح ويرجع يروح ويرجع عندنا مسار واحد للي حابب يمشي للي حابب يمشي فيه ما بين`,vocalizedText:`يَرُوحُ وَيَرْجِعُ يَرُوحُ وَيَرْجِعُ عِنْدنَا مَسَارَ وَاحِدَ لِلَيِّ حَابِبْ يُمَشِّي لِلَيِّ حَابِبْ يُمَشِّي فِيهِ مَا بَيْن`,transliteration:`yrwh wyrj‘ yrwh wyrj‘ ‘ndna msar wahd lly habb ymshy lly habb ymshy fyh ma byn`,translation:`Exactly — back and forth. Back and forth. We have one walking path... For those who prefer to walk. For those who prefer to walk. There are between 100,000 to 150,000 pilgrims`,notes:`Ahmad Al-Shugairi Hajj Episode (Seen 3).`,rootWords:[{word:`واحد`,root:`و-ح-د`,meaning:`One`}]},{id:43,start:332.5,end:338.4,text:`100 الى 150 ال حاج يرغبون في المشي ولهم مساحات مخصصه ايضا في مزدلفه للنزول بعيدا`,vocalizedText:`100 الى 150 الً حَاجَّ يَرْغَبُونَ فِي الْمَشْي وَلِهَمَّ مِسَاحَاتِ مُخَصَّصِهِ ايضا فِي مزدلفه لِلنُّزُولُ بَعيدًا`,transliteration:`100 alā 150 al haj yrghbwn fy almshy wlhm msahat mkhssh ayda fy mzdlfh llnzwl b‘yda`,translation:`There are between 100,000 to 150,000 pilgrims Who wish to walk. They also have designated areas in Muzdalifah to settle. Away from the transport routes.`,notes:`Ahmad Al-Shugairi Hajj Episode (Seen 3).`,rootWords:[{word:`حاج`,root:`ح-ج-ج`,meaning:`Pilgrim`}]},{id:44,start:338.4,end:343.6,text:`عن مسارات النقل اه مو داخلين في بعض كانت الاشكاليه انه مسار النقل هو مسار ماشيين`,vocalizedText:`عَن مَسَارَاتِ النَّقْلِ اه مو دَاخِلِينَ فِي بَعْضِ كانت الاشكاليه اِنْهَ مَسَارَ النَّقْلِ هُو مَسَارِ ماشيين`,transliteration:`‘n msarat alnql ah mw dakhlyn fy b‘d kant alashkalyh anh msar alnql hw msar mashyyn`,translation:`Away from the transport routes. Ah, so they don’t mix. The issue used to be that the transport route was the pedestrian route. They walked on the same street.`,notes:`Ahmad Al-Shugairi Hajj Episode (Seen 3).`,rootWords:[{word:`كانت`,root:`ك-و-ن`,meaning:`Was`}]},{id:45,start:343.6,end:348.6,text:`في نفس الشارع افتكر انا زمان فهذه تغيرت ولله الحمد واحده من مسارات الافاضه من`,vocalizedText:`فِي نَفْس الشَّارِعِ اِفْتَكَرَ انا زَمَانَ فهَذِه تَغَيَّرَتْ وَلََلَهَّ الْحَمْدُ وَاحِدُهُ مِن مَسَارَاتٍ الافاضه مِن`,transliteration:`fy nfs alshar‘ aftkr ana zman fhdhh tghyrt wllh alhmd wahdh mn msarat alafadh mn`,translation:`They walked on the same street. I remember back in the day. But that has changed, praise be to God. One of the evacuation paths from Arafat to Muzdalifah`,notes:`Ahmad Al-Shugairi Hajj Episode (Seen 3).`,rootWords:[{word:`نفس`,root:`ن-ف-س`,meaning:`Same`}]},{id:46,start:348.6,end:355.3,text:`عرفه الى مزدلفه هو مسار المشاه طبعا زمان تكلم عن المشاه كانوا بيمشوا مع مك e his heart rate now.`,notes:`Ahmad Al-Shugairi Hajj Episode (Seen 3).`,rootWords:[]},{id:107,start:712.4,end:717.6,text:`الطوارئ اذا كان يحتاج طيب اديني نبضات القلب حقته دحين نبضات القلب عنده تقريبا`,vocalizedText:`الطَّوَارِئُ اذا كَان يَحْتَاجُ طَيِّبُ اديني نَبْضَاتِ الْقَلْبِ حَقَّتِهِ دَحَيْنَ نَبْضَاتِ الْقَلْبِ عِنْدهُ تَقْريبًا`,transliteration:`altwar’ adha kan yhtaj tyb adyny nbdat alqlb hqth dhyn nbdat alqlb ‘ndh tqryba`,translation:`Alright, give me his heart rate now. His heart rate is around 71 bpm. His blood oxygen level is 97.`,notes:`Ahmad Al-Shugairi Hajj Episode (Seen 3).`,rootWords:[{word:`تقريبا`,root:`ق-ر-ب`,meaning:`Approximately`}]},{id:108,start:717.6,end:722.8,text:`71 نبضه بالدقيق معدل الاكسجين في الدم 97 الطبيعي يكون`,vocalizedText:`71 نَبْضَهُ بِالدَّقيقِ مُعَدَّلَ الاكسجين فِي الدَّمِ 97 الطَّبِيعِيَّ يُكَوِّنُ`,transliteration:`71 nbdh baldqyq m‘dl alaksjyn fy aldm 97 altby‘y ykwn`,translation:`His blood oxygen level is 97. Normally, it should be over 92. This is the idea of continuous improvement.`,notes:`Ahmad Al-Shugairi Hajj Episode (Seen 3).`,rootWords:[]},{id:109,start:722.8,end:729,text:`اكثر من 92 هذه فكره التحسين المستمر تى تحيه للي جاب الفكره نكمل انت دحين`,vocalizedText:`اُكْثُرْ مِن 92 هَذِه فِكْرِهِ التَّحْسِينَ الْمُسْتَمِرَّ تَى تُحَيِّهِ لِلَيِّ جَابٍ الفكره نُكْمِلُ اُنْتُ دُحِينَ`,transliteration:`akthr mn 92 hdhh fkrh althsyn almstmr tā thyh lly jab alfkrh nkml ant dhyn`,translation:`This is the idea of continuous improvement. Credit goes to the one who came up with it. Let’s continue. You're on full alert now, right?`,notes:`Ahmad Al-Shugairi Hajj Episode (Seen 3).`,rootWords:[]},{id:110,start:729,end:733.7,text:`استنفار صح نعم شغلين 24 ساعه نمت انت متى صاحي متى هنا`,vocalizedText:`اِسْتِنْفَارُ صَحَّ نِعْم شُغْلَيْنِ 24 سَاعِهِ نَمْتِ اُنْتُ مَتَى صاحي مَتَى هُنَا`,transliteration:`astnfar sh n‘m shghlyn 24 sa‘h nmt ant mtā sahy mtā hna`,translation:`You're on full alert now, right? Yes, we're working 24/7. When d 5,start:1063.3,end:1067.8,text:`ان شاء الله في متابعه حزمه امرا حزمه اعراض كيف يعني يجيني يقول لي والله في فت`,vocalizedText:`انَّ شَاءَ اللَّهُ فِي مُتَابِعِهِ حَزْمَهُ امراً حَزْمَهُ اعراض كَيْف يَعْنِي يَجِينِي يَقُولُ لِي وَاللهَ فِي فَتٍّ`,transliteration:`an sha’ allh fy mtab‘h hzmh amra hzmh a‘rad kyf y‘ny yjyny yqwl ly wallh fy ft`,translation:`You’re generous and we deserve it, inshallah. We’re monitoring a group of women... With a set of symptoms. What do you mean? Someone comes and says... There’s a lot of foot trauma.`,notes:`Ahmad Al-Shugairi Hajj Episode (Seen 3).`,rootWords:[{word:`يعني`,root:`ع-ن-ي`,meaning:`Meaning`}]},{id:166,start:1067.8,end:1073.7,text:`روما زايده نزلنا نقاط رعايه قدم وكاحل هذ موجوده الان موجوده في حتكون في بس فرق`,vocalizedText:`رُومَا زَايَدَهُ نُزُلُنَا نِقَاطَ رعايه قَدَمٌ وَكَاحِلُ هَذَّ مَوْجُودُهُ الَانِ مَوْجُودَهُ فِي حَتَكُونَ فِي بَسّ فَرْقٍ`,transliteration:`rwma zaydh nzlna nqat r‘ayh qdm wkahl hdh mwjwdh alan mwjwdh fy htkwn fy bs frq`,translation:`There’s a lot of foot trauma. So we deployed stations... For foot and ankle care. These exist now? Some are already in place. But with mobile teams.`,notes:`Ahmad Al-Shugairi Hajj Episode (Seen 3).`,rootWords:[{word:`فرق`,root:`ف-ر-ق`,meaning:`Teams`}]},{id:167,start:1073.7,end:1079.5,text:`راجله تعني برعايه القدم والكاحل حنشوف حب اشوف شوف فزي ما قال دكتور هاني اصابات`,vocalizedText:`رَاجِلُهُ تَعْنِي برعايه الْقَدَمَ وَالْكَاحِلَ حنشوف حُبَّ اشوف شُوفَ فَزَّيْ مَا قَالِ دُكْتورِ هَانِي اصابات`,transliteration:`rajlh t‘ny br‘ayh alqdm walkahl hnshwf hb ashwf shwf fzy ma qal dktwr hany asabat`,translation:`But with mobile teams. Dedicated to foot and ankle care. We’ll see. Inshallah. We’ll see. As Dr. Hani said... Foot injuries...`,notes:`Ahmad Al-Shugairi Hajj Episode (Seen 3).`,rootWords:[]},{id:168,start:1079.5,end:1084.1,text:`الرجل هذه ثاني حاله نشوفها بس في خمس دقائق وبس في المنطقه هنا سلامات يا سيدي`,vocalizedText:`الرَّجُلُ هَذِه ثاني حَالَهُ نَشُوفُهَا بَسّ فِي خُمُسِ دَقَائِقِ وبَسّ فِي المنطقه هُنَا سَلَاَمَاتِ يَا سَيِّدِي`,transliteration:`alrjl hdhh thany halh nshwfha bs fy khms dqa’q wbs fy almntqh hna slamat ya sydy`,translation:`Foot injuries... This is the second case we’ve seen in five minutes. Just in this area. Wishing you well, sir. How are you doing?`,notes:`Ahmad Al-Shugairi Hajj Episode (Seen 3).`,rootWords:[]},{id:169,start:1084.1,end:1089,text:`كيف حالك ايش صار لك من كثر المشي يلا الف سلامه عليك المشي على الاسفلت وعلى`,vocalizedText:`كَيْف حَالِكَ ايش صَار لَك مِن كُثْرِ الْمَشْي يَلَّا اُلْفُ سُلَّامَهُ عَلَيْك الْمَشْي عَلَى الاسفلت وعَلَى`,transliteration:`kyf halk aysh sar lk mn kthr almshy yla alf slamh ‘lyk almshy ‘lā alasflt w‘lā`,translation:`How are you doing? What happened to you? Walking. Too much walking. Wishing you a speedy recovery. Walking on asphalt and sidewalks...`,notes:`Ahmad Al-Shugairi Hajj Episode (Seen 3).`,rootWords:[]},{id:170,start:1089,end:1094.8,text:`الارصفه قاسيه فترات طويله يؤدي صعبات قدم وبالتالي هذه لاول مره في الحج تجربه`,vocalizedText:`الارصفه قَاسِيَهُ فَتْرَاتِ طَوِيلِهِ يُؤَدِّي صَعْبَاتُ قَدَمٍ وَبِالْتَّالِي هَذِه لاول مَرِهَ فِي الْحَجِّ تُجَرِّبُهُ`,transliteration:`alarsfh qasyh ftrat twylh y’dy s‘bat qdm wbaltaly hdhh lawl mrh fy alhj tjrbh`,translation:`Walking on asphalt and sidewalks... They're rough. With long distances... It causes foot injuries. Therefore... For the first time in Hajj... We’re testing rubber flooring.`,notes:`Ahmad Al-Shugairi Hajj Episode (Seen 3).`,rootWords:[{word:`الحج`,root:`ح-ج-ج`,meaning:`The Hajj (Fifth Pillar of Islam)`}]},{id:171,start:1094.8,end:1101.7,text:`الارض المطاطيه ارض مصنوعه من اطارات معالجه ليه علىشان تخفيف الضغط على القدم`,vocalizedText:`الارض المطاطيه اِرْضَ مَصْنُوعَهُ مِن اطارات مُعَالِجَهُ لِيهَ علىشان تَخْفِيفَ الضَّغْطِ عَلَى الْقَدَمِ`,transliteration:`alard almtatyh ard msnw‘h mn atarat m‘aljh lyh ‘lāshan tkhfyf aldght ‘lā alqdm`,translation:`We’re testing rubber flooring. It’s made from treated tires. Why? To reduce pressure on the feet. And thus lower the risk of injury.`,notes:`Ahmad Al-Shugairi Hajj Episode (Seen 3).`,rootWords:[]},{id:172,start:1101.7,end:1108,text:`وبالتالي تخفيف احتماليه الاصابات عاملين ماده برضو عازله علشان تعكس درجه الحراره`,vocalizedText:`وَبِالْتَّالِي تَخْفِيفَ اِحْتِمَالِيِّهِ الاصابات عَامِلِينَ مَادَّهُ بَرَضُو عَازِلِهِ علشان تَعْكِسُ دَرَجُهُ الحراره`,transliteration:`wbaltaly tkhfyf ahtmalyh alasabat ‘amlyn madh brdw ‘azlh ‘lshan t‘ks drjh alhrarh`,translation:`And thus lower the risk of injury. We also used an insulating material. To reflect the heat... Instead of absorbing it.`,notes:`Ahmad Al-Shugairi Hajj Episode (Seen 3).`,rootWords:[]},{id:173,start:1108,end:1113.1,text:`بدل ما تمتص على اساس نقدر نعالج على اقل تقدير او نخفف من هذه الحراره ف هنا تجربه`,vocalizedText:`بَدَلٌ مَا تَمْتَصُّ عَلَى اساس نُقَدِّرُ نُعَالِجُ عَلَى اُقْلُ تَقْديرَ او نُخَفِّفُ مِن هَذِه الحراره ف هُنَا تُجَرِّبُهُ`,transliteration:`bdl ma tmts ‘lā asas nqdr n‘alj ‘lā aql tqdyr aw nkhff mn hdhh alhrarh f hna tjrbh`,translation:`Instead of absorbing it. So we can treat... Or at least reduce the heat levels. Here’s an experiment...`,notes:`Ahmad Al-Shugairi Hajj Episode (Seen 3).`,rootWords:[]},{id:174,start:1113.1,end:1120.3,text:`وهذا بين لي درجه الحراره فعندي درجه الحراره هنا 3 ونص واضه واضحه 83 ونص هذا`,vocalizedText:`وهَذَا بَيْن لِي دَرَجِهِ الحراره فَعُنَّدِيَّ دَرَجِهِ الحراره هُنَا 3 وَنَصٌّ وَاِضْهَ وَاضِحَهُ 83 وَنَصَّ هَذَا`,transliteration:`whdha byn ly drjh alhrarh f‘ndy drjh alhrarh hna 3 wns wadh wadhh 83 wns hdha`,translation:`Here’s an experiment... This shows me the temperature. Here, I have the reading. 83.5 Clear. Clear. 83.5 right here.`,notes:`Ahmad Al-Shugairi Hajj Episode (Seen 3).`,rootWords:[]},{id:175,start:1120.3,end:1127.4,text:`هنا وهنا 71.8 تمام اشغلكم انتم دحين في وسط بس`,vocalizedText:`هُنَا وهُنَا 718 تَمَامٍ اِشْغَلْكُمْ اِنْتَمِ دُحِينَ فِي وَسَطِ بَسّ`,transliteration:`hna whna 71.8 tmam ashghlkm antm dhyn fy wst bs`,translation:`83.5 right here. And here... 71.8 Alright? I won’t take your time now, you’re in the middle of it. But what you're doing...`,notes:`Ahmad Al-Shugairi Hajj Episode (Seen 3).`,rootWords:[]},{id:176,start:1127.4,end:1131.8,text:`اللي بتسووا شيء يعني اتمنى لكل المشاهدين يستوعبوا الجهود اللي قاعدين يسووها مره`,vocalizedText:`اللَّيُّ بتسووا شَيْءٌ يَعْنِي اتمنى لكُلّ الْمُشَاهِدِينَ يَسْتَوْعِبُوا الْجُهُودَ اللَّيَّ قَاعِدِينَ يُسَوُّوهَا مَرِهَ`,transliteration:`ally btswwa shy’ y‘ny atmnā lkl almshahdyn ystw‘bwa aljhwd ally qa‘dyn yswwha mrh`,translation:`But what you're doing... I hope every viewer understands... The efforts you’re putting in. Thank you so much.`,notes:`Ahmad Al-Shugairi Hajj Episode (Seen 3).`,rootWords:[{word:`يعني`,root:`ع-ن-ي`,meaning:`Meaning`}]},{id:177,start:1131.8,end:1136.7,text:`شكرا يعطيكم العافيه في ميزان حسناتكم كل انسان تشيله عنه الم ان شاء الله تطلع لكم`,vocalizedText:`شُكْرًا يُعْطِيكُمْ العافيه فِي مِيزَانِ حُسْنَاتِكُمْ كُلّ انسان تَشِيلُهُ عَنهُ اُلْمُ انَّ شَاءَ اللَّهُ تَطَّلِعُ لَكُم`,transliteration:`shkra y‘tykm al‘afyh fy myzan hsnatkm kl ansan tshylh ‘nh alm an sha’ allh ttl‘ lkm`,translation:`Thank you so much. May God reward you — in your scale of good deeds. Every person you relieve of pain... May a prayer come your way.`,notes:`Ahmad Al-Shugairi Hajj Episode (Seen 3).`,rootWords:[{word:`كل`,root:`ك-ل-ل`,meaning:`Every`}]},{id:178,start:1136.7,end:1141,text:`دعوه وتطلع لنا احنا كمان معكم دعوه شكرا يعطيك العافيه ايش`,vocalizedText:`دَعَوْهُ وَتَطَلُّعٌ لَنَا احنا كَمَانَ مَعكُمْ دَعَوْهُ شُكْرًا يُعْطِيكَ العافيه ايش`,transliteration:`d‘wh wttl‘ lna ahna kman m‘km d‘wh shkra y‘tyk al‘afyh aysh`,translation:`May a prayer come your way. And to us too with you, inshaAllah. Thank you. God bless you. What’s this?`,notes:`Ahmad Al-Shugairi Hajj Episode (Seen 3).`,rootWords:[]},{id:179,start:1141,end:1147.8,text:`هذه يا سلام شكرا وزاره الصحه ربنا يكرمكم جميعا ويوسع رزقكم يا ابني ويوقف لكم`,vocalizedText:`هَذِه يَا سِلَامِ شُكْرًا وَزَارَهُ الصحه رَبَّنَا يُكْرِمُكُمْ جَمِيعَا وَيُوسِعُ رِزْقُكُمْ يَا اِبْنَِي وَيُوقَفُ لَكُم`,transliteration:`hdhh ya slam shkra wzarh alshh rbna ykrmkm jmy‘a wyws‘ rzqkm ya abny wywqf lkm`,translation:`What’s this? Wow! Thank you. Ministry of Health. May God bless you all. And expand your sustenance, my son. May righteous people support you.`,notes:`Ahmad Al-Shugairi Hajj Episode (Seen 3).`,rootWords:[{word:`سلام`,root:`س-ل-م`,meaning:`Peace`}]},{id:180,start:1147.8,end:1156.8,text:`اولاد الحلال ويكفيكم شر المرضين اهم حاجه في الدنيا بيقوللك رست وث از ه اول الغنى`,vocalizedText:`اولاد الْحَلَالَ وَيَكْفِيكُمْ شَرُّ الْمُرْضِينَ اهم حَاجِهِ فِي الدُّنْيَا بيقوللك رَسَتْ وث از ه اول الْغِنَى`,transliteration:`awlad alhlal wykfykm shr almrdyn ahm hajh fy aldnya byqwllk rst wth az h awl alghnā`,translation:`May righteous people support you. Amen. And protect you from illness. Amen. The most important thing in life... They say... The first wealth is health. The first blessing... Is health.`,notes:`Ahmad Al-Shugairi Hajj Episode (Seen 3).`,rootWords:[]},{id:181,start:1156.8,end:1164.4,text:`الصحه الواحد لو ما عنده صحه ما ح يستمتع باي غنى اخرين سواء كان فلوس او الصحه`,vocalizedText:`الصحه الْوَاحِدَ لَو مَا عِنْدهُ صحه مَا ح يَسْتَمْتِعُ بَاي غِنَى اخرين سَوَاءً كَان فُلُوسِ او الصحه`,transliteration:`alshh alwahd lw ma ‘ndh shh ma h ystmt‘ bay ghnā akhryn swa’ kan flws aw alshh`,translation:`Is health. If someone doesn’t have health... They won’t enjoy any other wealth. Whether it’s money or other forms of health.`,notes:`Ahmad Al-Shugairi Hajj Episode (Seen 3).`,rootWords:[]},{id:182,start:1164.4,end:1172.4,text:`الحمد لله موضوع المحاكاه وموضوع الفرضيات اللي بتتم قبل الحج فبسو محاكاه ل 12 قطاع`,vocalizedText:`الْحَمْدُ لِلَهَّ مَوْضُوعُ المحاكاه وَمَوْضُوعَ الْفَرْضِيَاتِ اللَّيَّ بِتْتُم قَبْل الْحَجِّ فبسُو محاكاه ل 12 قِطَاعٌ`,transliteration:`alhmd llh mwdw‘ almhakah wmwdw‘ alfrdyat ally bttm qbl alhj fbsw mhakah l 12 qta‘`,translation:`Alhamdullah Th up, how many groups form a unit.`,notes:`Ahmad Al-Shugairi Hajj Episode (Seen 3).`,rootWords:[{word:`عدد`,root:`ع-د-د`,meaning:`Number`}]},{id:215,start:1379.8,end:1386.2,text:`مجموعه تساوي عندي الوحده اللي هي الحافله 47 حج والوحده لها مرشد حافله اربع وحدات`,vocalizedText:`مَجْمُوعُهُ تُسَاوِي عُنَّدُي الوحده اللَّيَّ هِي الحافله 47 حَجَّ والوحده لَهَا مُرْشِدِ حَافِلِهِ اُرْبُعْ وَحْدَاتٍ`,transliteration:`mjmw‘h tsawy ‘ndy alwhdh ally hy alhaflh 47 hj walwhdh lha mrshd haflh arb‘ whdat`,translation:`how many groups form a unit. We have a unit, which is the bus, 47 pilgrims per bus, each bus has a guide. Four buses form one group,`,notes:`Ahmad Al-Shugairi Hajj Episode (Seen 3).`,rootWords:[{word:`حج`,root:`ح-ج-ج`,meaning:`Hajj`}]},{id:216,start:1386.2,end:1393.1,text:`تكون فوج واصبح العدد الفوج هنا 188 حاج الفوج له قائد فوج والخمس افواج تكون`,vocalizedText:`تَكَوَّنَ فَوْجٌ وَاِصْبَحْ الْعَدَدَ الْفَوْجَ هُنَا 188 حَاجَّ الْفَوْجِ لَه قَائِدِ فَوْجٍ وَالْخُمُسِ افواج تَكَوَّنَ`,transliteration:`tkwn fwj wasbh al‘dd alfwj hna 188 haj alfwj lh qa’d fwj walkhms afwaj tkwn`,translation:`Four buses form one group, making a total per group of 188 pilgrims. Each group has a leader. Five groups form one larger unit,`,notes:`Ahmad Al-Shugairi Hajj Episode (Seen 3).`,rootWords:[{word:`حاج`,root:`ح-ج-ج`,meaning:`Pilgrim`}]},{id:217,start:1393.1,end:1399.9,text:`مجموعه مجموعه 20 حافله ب 940 حاج كل مجموعه لها قياده تعال تعال طبعا موضوع`,vocalizedText:`مَجْمُوعُهُ مَجْمُوعُهُ 20 حَافِلَهُ ب 940 حَاجٌّ كُلّ مَجْمُوعِهِ لَهَا قِيَادِهِ تَعَالٍ تَعَالٍ طَبَعَا مَوْضُوعٌ`,transliteration:`mjmw‘h mjmw‘h 20 haflh b 940 haj kl mjmw‘h lha qyadh t‘al t‘al tb‘a mwdw‘`,translation:`Five groups form one larger unit, a group of 20 buses, 940 pilgrims. Each large group has its own leader. Come here, Regarding the grouping`,notes:`Ahmad Al-Shugairi Hajj Episode (Seen 3).`,rootWords:[{word:`حاج`,root:`ح-ج-ج`,meaning:`Pilgrim`},{word:`كل`,root:`ك-ل-ل`,meaning:`Every`}]},{id:218,start:1399.9,end:1406.8,text:`التفويج حق الجمرات زي ما قلنا كله مجدول وكل فوج لازم له قائد وبيمشوا مع بعض`,vocalizedText:`التفويج حَقَّ الْجَمْرَاتِ زِيٌّ مَا قُلِّنَا كُلّهُ مَجْدُولِ وكُلّ فَوْجِ لَازِمِ لَه قَائِدِ وبيمشوا مَع بَعْضِ`,transliteration:`altfwyj hq aljmrat zy ma qlna klh mjdwl wkl fwj lazm lh qa’d wbymshwa m‘ b‘d`,translation:`Regarding the grouping for Jamarat— as we said, it's all scheduled. Every group has a leader, and they walk together. To Jamarat.`,notes:`Ahmad Al-Shugairi Hajj Episode (Seen 3).`,rootWords:[]},{id:219,start:1406.8,end:1413.1,text:`جمرات يلا اي اي دور ارض شوف رايحين عارفين هم فين رايحين بقول`,vocalizedText:`جَمْرَاتُ يَلَّا اي اي دَوْرَ اِرْضَ شُوفَ رايحين عَارِفِينَ هُم فِيَنَّ رايحين بِقَوْلٍ`,transliteration:`jmrat yla ay ay dwr ard shwf rayhyn ‘arfyn hm fyn rayhyn bqwl`,translation:`To Jamarat. Let's go, which level? Which floor? Ground. Go ahead. Look. They're going, and they know exactly where. I asked him, which floor?`,notes:`Ahmad Al-Shugairi Hajj Episode (Seen 3).`,rootWords:[]},{id:220,start:1413.1,end:1417.8,text:`له اي الدور قال لي الدور الارضي فهذا الفوج من تركيا جايين بناء على الجدوله`,vocalizedText:`لَه اي الدَّوْرَ قَالٌ لِي الدَّوْرِ الارضي فهَذَا الْفَوْجِ مَن تُرْكَيَا جَايِينَ بِنَاءً عَلَى الجدوله`,transliteration:`lh ay aldwr qal ly aldwr alardy fhdha alfwj mn trkya jayyn bna’ ‘lā aljdwlh`,translation:`I asked him, which floor? He said, the ground floor. This group is from Turkey. They’re coming based on their scheduled time.`,notes:`Ahmad Al-Shugairi Hajj Episode (Seen 3).`,rootWords:[]},{id:221,start:1417.8,end:1425.8,text:`وهذه واحده من 32000 جدوله فقط لموضوع الجمرات اهلا وسهلا يعطيكم العافيه موفقين`,vocalizedText:`وهَذِه وَاحِدِهِ مِن 32000 جَدْوَلَهُ فقَطّ لِمَوْضُوعَ الْجَمْرَاتِ اهلا وَسَهْلًا يُعْطِيكُمْ العافيه مُوَفَّقِينَ`,transliteration:`whdhh wahdh mn 32000 jdwlh fqt lmwdw‘ aljmrat ahla wshla y‘tykm al‘afyh mwfqyn`,translation:`They’re coming based on their scheduled time. And this is just one... Of 32,000 scheduled entries for Jamarat. Just for Jamarat alone. Welcome, welcome. Bless you all. Best of luck.`,notes:`Ahmad Al-Shugairi Hajj Episode (Seen 3).`,rootWords:[{word:`فقط`,root:`ف-ق-ط`,meaning:`Only`}]},{id:222,start:1425.8,end:1430.4,text:`وهذا يجيلنا نقطه مره مهمه موضوع تصريح الحج بعض الناس ان شاء الله يكونوا`,vocalizedText:`وهَذَا يُجِيلُنَا نُقَطُهُ مَرَّهُ مُهِمَّهُ مَوْضُوعُ تَصْرِيحِ الْحَجِّ بَعْضَ النَّاسِ انَّ شَاءَ اللَّهُ يُكَوِّنُوا`,transliteration:`whdha yjylna nqth mrh mhmh mwdw‘ tsryh alhj b‘d alnas an sha’ allh ykwnwa`,translation:`Best of luck. And this brings us to a very important point. The Hajj permit issue. Some people... Hopefully they're the exception,`,notes:`Ahmad Al-Shugairi Hajj Episode (Seen 3).`,rootWords:[{word:`الحج`,root:`ح-ج-ج`,meaning:`The Hajj (Fifth Pillar of Islam)`}]},{id:223,start:1430.4,end:1436,text:`استثناء وليسوا الاغلبيه ما هم مستوعبين اهميه تصريح الحج تصريح الحج ليه مهم لانه`,vocalizedText:`اِسْتِثْنَاءٌ ولَيْسُوا الاغلبيه مَا هُم مُسْتَوْعِبِينَ اهميه تَصْرِيحَ الْحَجِّ تَصْرِيحَ الْحَجِّ لِيهَ مُهِمُّ لَانِهُ`,transliteration:`astthna’ wlyswa alaghlbyh ma hm mstw‘byn ahmyh tsryh alhj tsryh alhj lyh mhm lanh`,translation:`Hopefully they're the exception, And not the majority... They don't understand... The importance of the Hajj permit. Why is the Hajj permit important? Because all of this crowd management...`,notes:`Ahmad Al-Shugairi Hajj Episode (Seen 3).`,rootWords:[{word:`الحج`,root:`ح-ج-ج`,meaning:`The Hajj (Fifth Pillar of Islam)`}]},{id:224,start:1436,end:1442.6,text:`اداره الحشود هذه كلها مبنيه على شيء واحد الارقام اذا الاعداد تغيرت الاداره ذه`,vocalizedText:`اداره الْحُشُودَ هَذِه كُلّهَا مَبْنِيَّهُ عَلَى شَيْءِ وَاحِدِ الارقام اذا الاعداد تَغَيَّرَتْ الاداره ذِه`,transliteration:`adarh alhshwd hdhh klha mbnyh ‘lā shy’ wahd alarqam adha ala‘dad tghyrt aladarh dhh`,translation:`Because all of this crowd management... Is built on one thing: numbers. If the numbers change... The entire system falls apart. So if people enter without a permit...`,notes:`Ahmad Al-Shugairi Hajj Episode (Seen 3).`,rootWords:[{word:`الحشود`,root:`ح-ش-د`,meaning:`The crowds`},{word:`واحد`,root:`و-ح-د`,meaning:`One`}]},{id:225,start:1442.6,end:1450.3,text:`كلها تلخبطت فالناس لو دخلت بدون تصريح اذا هم عاملين الخطه على مثلا مليونين حاج`,vocalizedText:`كُلّهَا تلخبطت فَالنَّاسَ لَو دَخَلَتْ بِدُون تَصْرِيحِ اذا هُم عَامِلِينَ الخطه عَلَى مِثْلَا مِلْيُونَيْنِ حَاجٌّ`,transliteration:`klha tlkhbtt falnas lw dkhlt bdwn tsryh adha hm ‘amlyn alkhth ‘lā mthla mlywnyn haj`,translation:`So if people enter without a permit... If the plan was built for 2 million pilgrims... And 3 million show up... It throws off the entire plan.`,notes:`Ahmad Al-Shugairi Hajj Episode (Seen 3).`,rootWords:[{word:`حاج`,root:`ح-ج-ج`,meaning:`Pilgrim`}]},{id:226,start:1450.3,end:1456.2,text:`لقوا 3 مليون حاج دخلوا لخبط كل الخطه واذا تلخبطت الخطه حيادي الى ايش تكدس`,vocalizedText:`لَقُوا 3 مِلْيُونُ حَاجِّ دَخَلُوا لِخُبُطٍ كُلّ الخطه وَاذَا تلخبطت الخطه حِيَادَي الى ايش تَكَدُّسٌ`,transliteration:`lqwa 3 mlywn haj dkhlwa lkhbt kl alkhth wadha tlkhbtt alkhth hyady alā aysh tkds`,translation:`And when the plan falls apart... What does it lead to? Congestion. Congestion leads to what? Injuries. And even deaths.`,notes:`Ahmad Al-Shugairi Hajj Episode (Seen 3).`,rootWords:[{word:`مليون`,root:`م-ل-ي-ن`,meaning:`Million (1,000,000)`},{word:`حاج`,root:`ح-ج-ج`,meaning:`Pilgrim`},{word:`كل`,root:`ك-ل-ل`,meaning:`Every`}]},{id:227,start:1456.2,end:1462.7,text:`التكدس يؤدي الى ايش اصابات وفيات بسيط الموضوع يعني ما هو موضوع`,vocalizedText:`التَّكَدُّسُ يُؤَدِّي الى ايش اصابات وَفِيَّاتٍ بَسيطَ الْمَوْضُوعِ يَعْنِي مَا هُو مَوْضُوعٍ`,transliteration:`altkds y’dy alā aysh asabat wfyat bsyt almwdw‘ y‘ny ma hw mwdw‘`,translation:`Injuries. And even deaths. It's a simple matter. The Hajj permit issue... It's not... A personal issue.`,notes:`Ahmad Al-Shugairi Hajj Episode (Seen 3).`,rootWords:[{word:`يعني`,root:`ع-ن-ي`,meaning:`Meaning`}]},{id:228,start:1462.7,end:1467.8,text:`تصريح الحج ترى ما هو شخصي مثال بس بسيط يعني مثلا دحين احنا الناس تروح مباريات`,vocalizedText:`تَصْرِيحُ الْحَجِّ تَرَى مَا هُو شَخْصِيِّ مِثَالِ بَسّ بَسيطُ يَعْنِي مِثْلَا دُحِينَ احنا النَّاسَ تَرُوحُ مباريات`,transliteration:`tsryh alhj trā ma hw shkhsy mthal bs bsyt y‘ny mthla dhyn ahna alnas trwh mbaryat`,translation:`A personal issue. Just a simple example: Let’s say people are going to a football match. A game, in a stadium.`,notes:`Ahmad Al-Shugairi Hajj Episode (Seen 3).`,rootWords:[{word:`الحج`,root:`ح-ج-ج`,meaning:`The Hajj (Fifth Pillar of Islam)`},{word:`يعني`,root:`ع-ن-ي`,meaning:`Meaning`},{word:`تروح`,root:`ر-و-ح`,meaning:`Goes`}]},{id:229,start:1467.8,end:1473.6,text:`مباراه في ملعب تخيل انه الموضوع في ملعب كره قدم الناس تدخل كذا بدون تذاكر يحصل`,vocalizedText:`مباراه فِي مَلْعَبِ تَخَيُّلِ اِنْهَ الْمَوْضُوعَ فِي مَلْعَبِ كَرْهِ قَدِمَ النَّاسُ تَدْخُلُ كذَا بِدُون تَذَاكُرٍ يُحَصِّلُ`,transliteration:`mbarah fy ml‘b tkhyl anh almwdw‘ fy ml‘b krh qdm alnas tdkhl kdha bdwn tdhakr yhsl`,translation:`Imagine... People entering the stadium... Without tickets, just like that. There’ll be overcrowding. And you're talking about a stadium...`,notes:`Ahmad Al-Shugairi Hajj Episode (Seen 3).`,rootWords:[]},{id:230,start:1473.6,end:1480.4,text:`تقدس وانت بتتكلم على ملعب 50 الف انسان وشفنا امثله لما اداره الحشود في الملاعب`,vocalizedText:`تَقَدَّسْ وَاُنْتُ بتتكلم عَلَى مَلْعَبِ 50 اُلْفُ انسان وَشُفْنَا اُمْثُلْهُ لَمَّا اداره الْحُشُودَ فِي الْمُلَاعِبِ`,transliteration:`tqds want bttklm ‘lā ml‘b 50 alf ansan wshfna amthlh lma adarh alhshwd fy almla‘b`,translation:`And you're talking about a stadium... With 50,000 people. We've seen examples... Where poor crowd management... In stadiums led to deaths.`,notes:`Ahmad Al-Shugairi Hajj Episode (Seen 3).`,rootWords:[{word:`الحشود`,root:`ح-ش-د`,meaning:`The crowds`}]},{id:231,start:1480.4,end:1487,text:`تلخبطت وكيف صارت وفيات في ملاعب بسبب سوء اداره الحشود واحنا بنتكلم على 50 الف`,vocalizedText:`تلخبطت وكَيْف صَارَتْ وَفِيَّاتٌ فِي مُلَاعِبٍ بِسَبَبِ سُوءِ اداره الْحُشُودَ واحنا بنتكلم عَلَى 50 اُلْفُ`,transliteration:`tlkhbtt wkyf sart wfyat fy mla‘b bsbb sw’ adarh alhshwd wahna bntklm ‘lā 50 alf`,translation:`In stadiums led to deaths. Because of mismanagement. And that’s just 50,000 people. Here we’re talking about 2 million human beings.`,notes:`Ahmad Al-Shugairi Hajj Episode (Seen 3).`,rootWords:[{word:`الحشود`,root:`ح-ش-د`,meaning:`The crowds`}]},{id:232,start:1487,end:1493.1,text:`واحد هنا بنتكلم على 2 مليون بني ادم لماذا احنا نقول لا تحج الا تصريح عشان`,vocalizedText:`وَاحِدُ هُنَا بنتكلم عَلَى 2 مِلْيُونُ بُنِّي اِدْمَ لِمَاذَا احنا نُقُولٌ لَا تَحْجُ الًا تَصْرِيحَ عُشَّانِ`,transliteration:`wahd hna bntklm ‘lā 2 mlywn bny adm lmadha ahna nqwl la thj ala tsryh ‘shan`,translation:`Here we’re talking about 2 million human beings. That’s why we say: Do not come to Hajj without a permit. So that the services can be better. Awareness has increased, honestly.`,notes:`Ahmad Al-Shugairi Hajj Episode (Seen 3).`,rootWords:[{word:`واحد`,root:`و-ح-د`,meaning:`One`},{word:`مليون`,root:`م-ل-ي-ن`,meaning:`Million (1,000,000)`}]},{id:233,start:1493.1,end:1498.4,text:`الخدمه ترتفع الوعي ارتفع بامانه الحملات التوعويه اللي تقوم فيها المملكه وتقوم`,vocalizedText:`الخدمه تَرْتَفِعُ الْوَعْي اِرْتَفَعَ بامانه الْحَمْلَاتِ التوعويه اللَّيَّ تَقُومُ فِيهَا المملكه وَتَقُومُ`,transliteration:`alkhdmh trtf‘ alw‘y artf‘ bamanh alhmlat altw‘wyh ally tqwm fyha almmlkh wtqwm`,translation:`Awareness has increased, honestly. The awareness campaigns run by the Kingdom... And the various conferences... They’ve launched the "Makkah Route" initiative.`,notes:`Ahmad Al-Shugairi Hajj Episode (Seen 3).`,rootWords:[]},{id:234,start:1498.4,end:1504.7,text:`فيها المؤتمرات تم العمل طريق مكه طريق مكه تنهي اجراءات الحاج في بلده نوريكم`,vocalizedText:`فِيهَا الْمُؤْتَمَرَاتِ تَمَّ الْعَمَلُ طَرِيقَ مَكَّهُ طَرِيقُ مَكَّهُ تُنْهِي اجراءات الْحَاجَّ فِي بَلَدِهِ نُورِيِّكُمْ`,transliteration:`fyha alm’tmrat tm al‘ml tryq mkh tryq mkh tnhy ajra’at alhaj fy bldh nwrykm`,translation:`They’ve launched the "Makkah Route" initiative. Makkah Route finalizes the pilgrim’s process... From their home country before they even arrive. Let us show you a real case of the Makkah Route initiative.`,notes:`Ahmad Al-Shugairi Hajj Episode (Seen 3).`,rootWords:[]},{id:235,start:1504.7,end:1510.8,text:`حاله عمليه لمبادره طريق مكه طبعا خدمه الحجاج تبدا من الجوازات من التحديات`,vocalizedText:`حَالُهُ عَمَلِيُّهُ لِمُبَادِرَهُ طَرِيقَ مَكَّهُ طَبْعَا خَدَمِهِ الْحُجَّاجَ تَبُدَّا مِن الْجَوَازَاتِ مِن التَّحَدِّيَاتِ`,transliteration:`halh ‘mlyh lmbadrh tryq mkh tb‘a khdmh alhjaj tbda mn aljwazat mn althdyat`,translation:`Let us show you a real case of the Makkah Route initiative. Of course, pilgrim services start from the passport control. One of the challenges is overcrowding...`,notes:`Ahmad Al-Shugairi Hajj Episode (Seen 3).`,rootWords:[{word:`الحجاج`,root:`ح-ج-ج`,meaning:`The pilgrims`},{word:`التحديات`,root:`ح-د-ي`,meaning:`The challenges`}]},{id:236,start:1510.8,end:1515.6,text:`الازدحام الشديد اللي بيحصل في المطارات يعني تخيلوا مليون ونص حاج بيوصلوا عبر`,vocalizedText:`الْاِزْدِحَامُ الشَّدِيدُ اللَّيَّ بِيَحْصُلُ فِي الْمَطَارَاتِ يَعْنِي تَخَيَّلُوا مِلْيُونَ وَنَصَّ حَاجِّ بيوصلوا عَبْرٌ`,transliteration:`alazdham alshdyd ally byhsl fy almtarat y‘ny tkhylwa mlywn wns haj bywslwa ‘br`,translation:`One of the challenges is overcrowding... That happens in airports. Imagine — 1.5 million pilgrims... Arriving by air.`,notes:`Ahmad Al-Shugairi Hajj Episode (Seen 3).`,rootWords:[{word:`يعني`,root:`ع-ن-ي`,meaning:`Meaning`},{word:`مليون`,root:`م-ل-ي-ن`,meaning:`Million (1,000,000)`},{word:`حاج`,root:`ح-ج-ج`,meaning:`Pilgrim`}]},{id:237,start:1515.6,end:1522.7,text:`الطائرات في فتره محدوده جدا في اكثر من 8000 طياره عشان تتخيلوا الحجم مطار هيثرو`,vocalizedText:`الطَّائِرَاتُ فِي فِتْرِهِ مَحْدُودِهِ جِدّا فِي اُكْثُرْ مِن 8000 طَيَّارَهُ عُشَّانِ تَتَخَيَّلُوا الْحَجْمَ مَطَارَ هِيثْرُوٍ`,transliteration:`alta’rat fy ftrh mhdwdh jda fy akthr mn 8000 tyarh ‘shan ttkhylwa alhjm mtar hythrw`,translation:`Arriving by air. Within a very short timeframe. More than 8,000 flights... Just to give you scale. Heathrow Airport receives 160 flights per day.`,notes:`Ahmad Al-Shugairi Hajj Episode (Seen 3).`,rootWords:[]},{id:238,start:1522.7,end:1529,text:`بيستقبل 160 طياره في اليوم احنا بنتكلم عن 8000 طياره بتيجي بفتره محدوده جدا`,vocalizedText:`بيستقبل 160 طَيَّارَهُ فِي الْيَوْمِ احنا بنتكلم عَن 8000 طَيَّارَهُ بتيجي بِفِتْرِهِ مَحْدُودِهِ جِدّا`,transliteration:`bystqbl 160 tyarh fy alywm ahna bntklm ‘n 8000 tyarh btyjy bftrh mhdwdh jda`,translation:`Heathrow Airport receives 160 flights per day. We're talking about 8,000 flights... Arriving in a very short period of time.`,notes:`Ahmad Al-Shugairi Hajj Episode (Seen 3).`,rootWords:[]},{id:239,start:1529,end:1534.8,text:`وهذا طبيعي يسبب زحام وبالتالي يجلسوا ساعات ع شان يخلصوا اجراءات الجوازات عشان`,vocalizedText:`وهَذَا طَبِيعِيٌّ يُسَبِّبُ زِحَامٌ وَبِالْتَّالِي يُجْلِسُوا سَاعَاتٍ ع شَانَ يَخْلُصُوا اجراءات الْجَوَازَاتِ عُشَّانِ`,transliteration:`whdha tby‘y ysbb zham wbaltaly yjlswa sa‘at ‘ shan ykhlswa ajra’at aljwazat ‘shan`,translation:`Arriving in a very short period of time. Naturally, this causes congestion. So they end up spending hours Just to complete passport procedures. That's why, as part of continuous improvement,`,notes:`Ahmad Al-Shugairi Hajj Episode (Seen 3).`,rootWords:[]},{id:240,start:1534.8,end:1541.9,text:`كده من باب التحسين المستمر في مبادره طريق مكه هدفها تسريع هذه الخدمه يعني`,vocalizedText:`كِدْهُ مِن بَابِ التَّحْسِينِ الْمُسْتَمِرِّ فِي مُبَادِرِهِ طَرِيقَ مَكَّهُ هَدَفُهَا تَسْرِيعَ هَذِه الخدمه يَعْنِي`,transliteration:`kdh mn bab althsyn almstmr fy mbadrh tryq mkh hdfha tsry‘ hdhh alkhdmh y‘ny`,translation:`That's why, as part of continuous improvement, The "Makkah Route" initiative was launched. Its goal is to speed up this service. Let’s take Mr. 00)`},{word:`تقدم`,root:`ق-د-م`,meaning:`Is provided`}]},{id:254,start:1624.6,end:1631.6,text:`الامباير ستيت بدين واحده من اطول العماير في العالم وصبينا كده مويه بالكامل من فوق`,vocalizedText:`الامباير ستيت بِدِينِ وَاحِدِهِ مَن اِطْوَلْ العماير فِي الْعَالَمِ وَصَبِيِّنَا كِدْهُ مُوَيْهٍ بِالْكَامِلِ مِن فَوْق`,transliteration:`alambayr styt bdyn wahdh mn atwl al‘mayr fy al‘alm wsbyna kdh mwyh balkaml mn fwq`,translation:`If we take the Empire State Building, One of the tallest buildings in the world, And filled it completely with water— From top to bottom—`,notes:`Ahmad Al-Shugairi Hajj Episode (Seen 3).`,rootWords:[{word:`العالم`,root:`ع-ل-م`,meaning:`The world`}]},{id:255,start:1631.6,end:1640.1,text:`لتحت كل يوم بيتم صرف مياه بهذه السعه فاح جام مياه ضخمه جدا علشان توفر ال 2 مليون`,vocalizedText:`لِتَحُتُّ كُلّ يَوْمٍ بِيُتْمِ صَرْفِ مِيَاهٍ بهَذِه اِلْسَعْهُ فَاحَ جَامُ مِيَاهِ ضَخْمِهِ جِدّا علشان تُوَفِّرُ الُ 2 مِلْيُونُ`,transliteration:`ltht kl ywm bytm srf myah bhdhh als‘h fah jam myah dkhmh jda ‘lshan twfr al 2 mlywn`,translation:`From top to bottom— That’s how much water is distributed every day. Huge volumes of water... To serve 2 million pilgrims.`,notes:`Ahmad Al-Shugairi Hajj Episode (Seen 3).`,rootWords:[{word:`كل`,root:`ك-ل-ل`,meaning:`Every`},{word:`يوم`,root:`ي-و-م`,meaning:`Day`},{word:`مليون`,root:`م-ل-ي-ن`,meaning:`Million (1,000,000)`}]},{id:256,start:1640.1,end:1648.9,text:`حاج من ضمن الادوات للتحسين المستمر مؤتمر الحج على مساحه 00000 متر مربع هذه النسخه`,vocalizedText:`حَاجٌّ مِن ضِمْن الادوات لِلتَّحْسِينَ الْمُسْتَمِرَّ مُؤْتَمِرُ الْحَجِّ عَلَى مَسَّاحِهِ 00000 مِتْرٍ مُرَبَّعٍ هَذِه النسخه`,transliteration:`haj mn dmn aladwat llthsyn almstmr m’tmr alhj ‘lā msahh 00000 mtr mrb‘ hdhh alnskhh`,translation:`To serve 2 million pilgrims. As part of the tools... For continuous improvement — the Hajj Conference. Held over 50,000 square meters. This is the fourth edition, started in 2021.`,notes:`Ahmad Al-Shugairi Hajj Episode (Seen 3).`,rootWo لشِّتَاءِ الْقَادِمِ`,transliteration:`kānat tajma‘u hubūbal-qamhi wa takhzunuhā lifaslish-shitā’il-qādim.`,translation:`She was gathering wheat grains and storing them for the coming winter season.`,notes:`Grammar: "تَخْزُنُهَا" contains the verb root خ-ز-ن (store/treasury, source of magazine/makhzan) + pronoun "هَا" (them).`,rootWords:[{word:`تجمع`,root:`ج-م-ع`,meaning:`she gathers`},{word:`حبوب`,root:`ح-ب-ب`,meaning:`grains / seeds`},{word:`القمح`,root:`ق-م-ح`,meaning:`wheat`},{word:`الشتاء`,root:`ش-ت-و`,meaning:`winter`}]},{id:3,start:9.2,end:14.8,text:`أَمَّا الصُّرْصُورُ، فَكَانَ يُغَنِّي وَيَلْعَبُ تَحْتَ ظِلِّ شَجَرَةٍ كَبِيرَةٍ.`,vocalizedText:`أَمَّا الصُّرْصُورُ ، فَكَانَ يُغَنِّي وَيَلْعَبُ تَحْتَ ظِلَّ شَجَرَةٍ كَبِيرَةٍ`,transliteration:`ammāṣ-ṣurṣūru fakāna yughannī wa yal‘abu tahta zilli shajaratin kabīrah.`,translation:`As for the grasshopper, he was singing and playing under the shade of a big tree.`,notes:`"أَمَّا ... فَـ..." is a standard Arabic construction for "as for [X], then [Y]".`,rootWords:[{word:`يغني`,root:`غ-ن-ي`,meaning:`he sings`},{word:`يلعب`,root:`ل-ع-ب`,meaning:`he plays`},{word:`ظل`,root:`ظ-ل-ل`,meaning:`shade`},{word:`شجرة`,root:`ش-ج-ر`,meaning:`tree`}]},{id:4,start:14.8,end:19.5,text:`قَالَ لَهَا: لِمَاذَا تَعْمَلِينَ كُلَّ هَذَا الوَقْتِ؟ تَعَالَيْ وَالْعَبِي مَعِي!`,vocalizedText:`قَالَ لَهَالِمَاذَا تَعْمَلِينَ كُلّ هَذَّا الْوَقْتِ ؟ تَعَالَيْ وَالْعَبِّيَّ مَعِيٌّ`,transliteration:`qāla lahā: limādhā ta‘malīna kulla hādhāl-waqt? ta‘ālay wal‘abī ma‘ī!`,translation:`He said to her: Why do you work all this time? Come and play with me!`,notes:`"تَعَالَيْ" is the imperative feminine form of "come".`,rootWords:[{word:`قال`,root:`ق-و-ل`,meaning:`he said`},{word:`لماذا`,root:`م-ا`,meaning:`why`},{word:`الوقت`,root:`و-ق-ت`,meaning:`time`},{word:`معي`,root:`م-ع-ي`,meaning:`with me`}]},{id:5,start:19.5,end:25,text:`أَجَابَتِ النَّمْلَةُ بِهُدُوءٍ: أَنَا أَسْتَعِدُّ لِلشِّتَاءِ، وَأَنْصَحُكَ أَنْ تَفْعَلَ المِثْلَ.`,vocalizedText:`أَجَابَتْ النَّمْلَةُ بِهُدُوءٍأَْنََا أَسْتَعِدُّ لِلشِّتَاءِ ، وَأَنْصَحُكَ أَْنْ تَفْعَلَ الْمِثْلَ`,transliteration:`ajābatin-namlatu bi-hudū’: anā asta‘iddu lish-shitā’, wa ansahuka an taf‘alal-mithl.`,translation:`The ant replied calmly: I am preparing for winter, and I advise you to do the same.`,notes:`Verb root ع-د-د: "أَسْتَعِدُّ" (Form X: to prepare oneself).`,rootWords:[{word:`أجابت`,root:`ج-و-ب`,meaning:`she answered`},{word:`بهدوء`,root:`ه-د-أ`,meaning:`calmly`},{word:`أستعد`,root:`ع-د-د`,meaning:`I prepare`},{word:`أنصحك`,root:`ن-ص-ح`,meaning:`I advise you`}]},{id:6,start:25,end:30.5,text:`ضَحِكَ الصُّرْصُورُ وَقَالَ: الشِّتَاءُ مَا زَالَ بَعِيداً جِدّاً، دَعِينَا نَسْتَمْتِعُ بِالحَيَاةِ!`,vocalizedText:`ضَحِكَ الصُّرْصُورُ وَقَالَالشِّتَاءُ مَا زَالَ بَعيدًا جِدًّا ، دَعِينَا نَسْتَمْتِعُ بِالْحَيَاةِ`,transliteration:`dahikaṣ-ṣurṣūru wa qāl: ash-shitā’u mā zāla ba‘īdan jiddan, da‘īnā nastamti‘u bil-hayāh!`,translation:`The grasshopper laughed and said: Winter is still very far away, let us enjoy life!`,notes:`"مَا زَالَ" expresses "still / continues to be". "نَسْتَمْتِعُ" root م-ت-ع (enjoy).`,rootWords:[{word:`ضحك`,root:`ض-ح-ك`,meaning:`he laughed`},{word:`بعيداً`,root:`ب-ع-د`,meaning:`far`},{word:`نستمتع`,root:`م-ت-ع`,meaning:`we enjoy`},{word:`الحياة`,root:`ح-ي-ي`,meaning:`life`}]}]},{id:`arabic-conversation-2`,youtubeId:`z-Nu3v2_v3A`,title:`محادثة في المقهى العربي (Coffee Shop Conversation) - Levantine & MSA`,channel:`Easy Arabic Series`,targetLang:`Arabic`,targetLangCode:`ar`,nativeLang:`English`,nativeLangCode:`en`,level:`Intermediate`,category:`Daily Conversation`,thumbnail:`https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?auto=format&fit=crop&w=600&q=80`,description:`Realistic conversation between friends meeting at a cafe in Amman, practicing ordering drinks and catching up.`,subtitles:[{id:1,start:0,end:3.8,text:`أَهْلاً وَسَهْلاً يَا أَحْمَد، كَيْفَ حَالُكَ اليَوْم؟`,vocalizedText:`أهْلَا وَسَهْلَا يَا أَحْمَدُ ، كَيْفَ حَالُكَ الْيَوْمَ ؟`,transliteration:`ahlan wa sahlan yā ahmad, kayfa hāluka al-yawm?`,translation:`Welcome Ahmad, how are you doing today?`,rootWords:[{word:`أهلاً`,root:`أ-ه-ل`,meaning:`welcome (like family)`},{word:`كيف`,root:`ك-ي-ف`,meaning:`how`},{word:`حالك`,root:`ح-و-ل`,meaning:`your condition`}]},{id:2,start:3.8,end:8.2,text:`الحَمْدُ للهِ، أَنَا بِخَيْرٍ. وَأَنْتَ، كَيْفَ كَانَ يَوْمُكَ فِي العَمَلِ؟`,vocalizedText:`الْحَمْدُ للهِ ، أَْنََا بِخَيْرٍوَأَنْتَ ، كَيْفَ كَانَ يَوْمُكَ فِِي الْعَمَلِ ؟`,transliteration:`al-hamdu lillāh, anā bi-khayr. wa anta, kayfa kāna yawmuka fīl-‘amal?`,translation:`Praise be to God, I am doing well. And you, how was your day at work?`,rootWords:[{word:`الحمد`,root:`ح-م-د`,meaning:`praise`},{word:`بخير`,root:`خ-ي-ر`,meaning:`with goodness / well`},{word:`العمل`,root:`ع-م-ل`,meaning:`work / job`}]},{id:3,start:8.2,end:13.5,text:`كَانَ يَوْماً طَوِيلاً وَمَلِيئاً بِالاجْتِمَاعَاتِ، لِذَلِكَ أَنَا بِحَاجَةٍ إِلَى فِنْجَانِ قَهْوَةٍ قَوِيٍّ.`,vocalizedText:`كَانَ يَوْمًا طَوِيلًا وَمَلِيئًا بِالْاِجْتِمَاعَاتِ ، لِذَلِكَ أَْنََا بِحَاجَةٍ إِِْلََى فِنْجَانِ قَهْوَةٍ قَوِيٍّ`,transliteration:`kāna yawman tawīlan wa malī’an bil-ijtimā‘āt, li-dhālika anā bi-hājah ilā finjāni qahwatin qawiyy.`,translation:`It was a long day full of meetings, so I really need a cup of strong coffee.`,rootWords:[{word:`طويلاً`,root:`ط-و-ل`,meaning:`long`},{word:`مليئاً`,root:`م-ل-أ`,meaning:`full`},{word:`فنجان`,root:`ف-ن-ج-ن`,meaning:`cup`},{word:`قهوة`,root:`ق-ه-و`,meaning:`coffee`}]},{id:4,start:13.5,end:18,text:`أَنَا أُفَضِّلُ الشَّايَ بِالنَّعْنَاعِ، طَعْمُهُ مُنْعِشٌ جِدّاً فِي هَذَا المَسَاءِ.`,vocalizedText:`أَْنََا أُفَضِّلُ الشَّاي بِالنَّعْنَاعِ ، طَعْمُهُ مُنْعِشٌ جِدًّا فِِي هَذَّا الْمَسَاءِ`,transliteration:`anā ufaddilush-shāya bin-na‘nā‘, ta‘muhū mun‘ishun jiddan fī hādhāl-masā’.`,translation:`I prefer tea with mint; its taste is very refreshing this evening.`,rootWords:[{word:`أفضل`,root:`ف-ض-ل`,meaning:`I prefer`},{word:`الشاي`,root:`ش-ا-ي`,meaning:`tea`},{word:`منعش`,root:`ن-ع-ش`,meaning:`refreshing`}]}]},{id:`spanish-travel-3`,youtubeId:`8jP0Gk8t3fM`,title:`Un Día en Barcelona - Spanish Travel & Conversation`,channel:`Español con Juan`,targetLang:`Spanish`,targetLangCode:`es`,nativeLang:`English`,nativeLangCode:`en`,level:`Beginner`,category:`Travel & Culture`,thumbnail:`https://images.unsplash.com/photo-1583422409516-2895a77efded?auto=format&fit=crop&w=600&q=80`,description:`Learn Spanish naturally walking through the vibrant streets and plazas of Barcelona.`,subtitles:[{id:1,start:0,end:4.2,text:`¡Hola a todos! Bienvenidos a un nuevo vídeo por las calles de Barcelona.`,translation:`Hello everyone! Welcome to a new video through the streets of Barcelona.`},{id:2,start:4.2,end:8.5,text:`Hoy hace un día espectacular con mucho sol y una brisa marina maravillosa.`,translation:`Today is a spectacular day with lots of sunshine and a wonderful sea breeze.`},{id:3,start:8.5,end:13,text:`Vamos a visitar el mercado de La Boquería para probar algunas frutas frescas y tapas locales.`,translation:`We are going to visit the Boqueria market to try some fresh fruits and local tapas.`},{id:4,start:13,end:17.8,text:`¿Habéis estado alguna vez en esta hermosa ciudad española?`,translation:`Have you ever been to this beautiful Spanish city?`}]},{id:`japanese-dialogue-4`,youtubeId:`wF_vK9y_n7M`,title:`日本のカフェで注文する (Ordering at a Japanese Cafe)`,channel:`Nihongo Learning`,targetLang:`Japanese`,targetLangCode:`ja`,nativeLang:`English`,nativeLangCode:`en`,level:`Beginner`,category:`Daily Life`,thumbnail:`https://images.unsplash.com/photo-1503899036084-c55cdd92da26?auto=format&fit=crop&w=600&q=80`,description:`Practical polite phrases for ordering drinks and sweets in Tokyo cafes.`,subtitles:[{id:1,start:0,end:3.5,text:`いらっしゃいませ！店内でお召し上がりですか？`,transliteration:`Irasshaimase! Tennai de omeshiagari desu ka?`,translation:`Welcome! Will you be having it here in the cafe?`},{id:2,start:3.5,end:7.2,text:`はい、ここで飲みます。アイスコーヒーを一つお願いします。`,transliteration:`Hai, koko de nomimasu. Aisu kōhī o hitotsu onegaishimasu.`,translation:`Yes, I will drink it here. One iced coffee please.`},{id:3,start:7.2,end:11.5,text:`サイズはいかがなさいますか？ショート、トール、グランデがございます。`,transliteration:`Saizu wa ikaga nasaimasu ka? Shōto, tōru, gurande ga gozaimasu.`,translation:`Which size would you like? We have short, tall, and grande.`},{id:4,start:11.5,end:15,text:`トールサイズで、ミルクも付けてください。ありがとうございます！`,transliteration:`Tōru saizu de, miruku mo tsukete kudasai. Arigatō gozaimasu!`,translation:`Tall size please, and please include milk. Thank you!`}]},{id:`malayalam-kerala-travel-5`,youtubeId:`7X8II6J-6mU`,title:`കേരളത്തിലെ മനോഹരമായ കാഴ്ചകൾ | Discovering Kerala (Malayalam with Manglish)`,channel:`Kerala Cultural Immersion`,targetLang:`Malayalam`,targetLangCode:`ml`,nativeLang:`English`,nativeLangCode:`en`,level:`Beginner`,category:`Travel & Culture`,thumbnail:`https://images.unsplash.com/photo-1602216056096-3b40cc0c9944?auto=format&fit=crop&w=600&q=80`,description:`Learn everyday conversational Malayalam with authentic Malayalam script, Manglish transliteration, and English translations.`,subtitles:[{id:1,start:0,end:4.8,text:`നമസ്കാരം! ദൈവത്തിന്റെ സ്വന്തം നാട്ടിലേക്ക് എല്ലാവർക്കും സ്വാഗതം.`,vocalizedText:`നമസ്കാരം! ദൈവത്തിന്റെ സ്വന്തം നാട്ടിലേക്ക് എല്ലാവർക്കും സ്വാഗതം.`,transliteration:`Namaskāram! Daivathinte swantham naattilekku ellāvarkkum swāgatham.`,translation:`Greetings! Welcome everyone to God's Own Country.`,notes:`Classic warm Kerala greeting used in formal and friendly cultural contexts.`,rootWords:[{word:`നമസ്കാരം`,root:`നമസ്-കാരം`,meaning:`respectful greeting`},{word:`സ്വാഗതം`,root:`സ്വാ-ഗതം`,meaning:`welcome`}]},{id:2,start:4.8,end:10.2,text:`ഇന്ന് നമ്മൾ ആലപ്പുഴയിലെ മനോഹരമായ കായലുകളിലൂടെ ഒരു വള്ളത്തിൽ യാത്ര ചെയ്യുന്നു.`,vocalizedText:`ഇന്ന് നമ്മൾ ആലപ്പുഴയിലെ മനോഹരമായ കായലുകളിലൂടെ ഒരു വള്ളത്തിൽ യാത്ര ചെയ്യുന്നു.`,transliteration:`Innu nammal Ālappuzhayile manōharamāya kāyalukalilūde oru vallathil yāthra cheyyunnu.`,translation:`Today we are traveling on a country boat through the serene backwaters of Alappuzha.`,notes:`Notice the postposition -ilūde (through) attached to kāyalukal (backwaters).`,rootWords:[{word:`കായൽ`,root:`കായലുകൾ`,meaning:`backwaters / lagoons`},{word:`യാത്ര`,root:`യാത്ര`,meaning:`journey / travel`}]},{id:3,start:10.2,end:15.6,text:`ഇവിടുത്തെ തനതായ പ്രഭാതഭക്ഷണമായ ചൂടുള്ള അപ്പവും മുട്ടക്കറിയും നമുക്ക് കഴിക്കാം.`,vocalizedText:`ഇവിടുത്തെ തനതായ പ്രഭാതഭക്ഷണമായ ചൂടുള്ള അപ്പവും മുട്ടക്കറിയും നമുക്ക് കഴിക്കാം.`,transliteration:`Ividuththe thanathāya prabhāthabhakshanamāya chūdulla appavum muttakariyum namukku kazhikkām.`,translation:`Let's taste the authentic local breakfast: piping hot appam with spicy egg curry.`,notes:`Namukku kazhikkām is the polite inclusive cohortative ("Let us eat").`,rootWords:[{word:`പ്രഭാതഭക്ഷണം`,root:`പ്രഭാതം+ഭക്ഷണം`,meaning:`breakfast`},{word:`ചൂടുള്ള`,root:`ചൂട്`,meaning:`hot / warm`}]},{id:4,start:15.6,end:21,text:`നിങ്ങൾക്ക് കേരളത്തിലെ ഭക്ഷണം ഇഷ്ടപ്പെട്ടോ? തീർച്ചയായും നിങ്ങൾ ഇതൊന്നു പരീക്ഷിക്കണം!`,vocalizedText:`നിങ്ങൾക്ക് കേരളത്തിലെ ഭക്ഷണം ഇഷ്ടപ്പെട്ടോ? തീർച്ചയായും നിങ്ങൾ ഇതൊന്നു പരീക്ഷിക്കണം!`,transliteration:`Ningalkku Kēralathile bhakshanam ishtappettō? Theerchayāyum ningal ithonnu pareekshikkanam!`,translation:`Did you enjoy Kerala cuisine? You should definitely try this out!`,notes:`Ishtappettō uses dative ningalkku ("To you is it pleasing?").`,rootWords:[{word:`ഇഷ്ടം`,root:`ഇഷ്ടപ്പെടുക`,meaning:`to like / enjoy`},{word:`തീർച്ചയായും`,root:`തീർച്ച`,meaning:`definitely / certainly`}]}]},{id:`english-daily-conversation-6`,youtubeId:`b1kW1m4o5zE`,title:`Natural Conversational English | Daily Idioms for Malayalam & Hindi Speakers`,channel:`Fluent Living Media`,targetLang:`English`,targetLangCode:`en`,nativeLang:`Malayalam`,nativeLangCode:`ml`,level:`Intermediate`,category:`Conversational Fluency`,thumbnail:`https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=600&q=80`,description:`Learn real native conversational English without literal translation traps. Features natural idioms and tag questions.`,subtitles:[{id:1,start:0,end:4.5,text:`Didn't you say that yourself yesterday?`,vocalizedText:`Didn't you say that yourself yesterday?`,transliteration:`നീ തന്നെയല്ലേ ഇന്നലെ അങ്ങനെ പറഞ്ഞത്? (Nee thanneyalle innale angane paranjathu?)`,translation:`Avoid saying 'You only told that'. Native speakers use 'Didn't you say that yourself?'`,notes:`Key contrast: English uses negative tag and reflexive 'yourself' instead of Indian English 'only'.`,rootWords:[{word:`yourself`,root:`reflexive`,meaning:`നീ തന്നെ (emphatic)`},{word:`didn't you`,root:`tag-question`,meaning:`അല്ലേ? (confirmation)`}]},{id:2,start:4.5,end:9.8,text:`I was just saying, I didn't mean anything by it.`,vocalizedText:`I was just saying, I didn't mean anything by it.`,transliteration:`വെറുതെ അങ്ങനെ പറഞ്ഞതാ, ഒന്നും ഉദ്ദേശിച്ചല്ല. (Veruthe angane paranjathaa)`,translation:`Instead of 'Simply I told', native speakers say 'I was just saying' to soften their words.`,notes:`Notice how 'just saying' diffuses tension effortlessly.`,rootWords:[{word:`just`,root:`softener`,meaning:`വെറുതെ / വെറുതെ ഒരു തമാശയ്ക്ക്`},{word:`mean`,root:`intend`,meaning:`ഉദ്ദേശിക്കുക`}]},{id:3,start:9.8,end:15,text:`Could you turn on the fan and drop by our office for a minute?`,vocalizedText:`Could you turn on the fan and drop by our office for a minute?`,transliteration:`ഫാൻ ഒന്ന് ഇടാമോ? ഓഫീസിലേക്ക് ഒരു നിമിഷം വരാമോ? (Drop by)`,translation:`Say 'turn on the fan' (not 'open the fan'), and 'drop by' (not 'come and go').`,notes:`'Turn on' is the universal collocation for electrical switches and devices.`,rootWords:[{word:`turn on`,root:`phrasal verb`,meaning:`സ്വിച്ച് ഓൺ ചെയ്യുക / ലൈറ്റ് ഇടുക`},{word:`drop by`,root:`phrasal verb`,meaning:`വന്നിട്ട് പോവുക / ചെറുതായി സന്ദർശിക്കുക`}]},{id:4,start:15,end:20.5,text:`I'm feeling a bit cold, so I think I'll wrap up for the day.`,vocalizedText:`I'm feeling a bit cold, so I think I'll wrap up for the ी पेशेवर साक्षात्कार में मुख्य बात यह है कि आप अपने प्रभाव को स्पष्ट रूप से प्रस्तुत करें।`,notes:`Professional business English.`}]},{id:`arabic-daily-market-dialogues`,youtubeId:`3nQNiWdeH2Q`,title:`حوارات يومية في السوق والمقهى | Spoken Arabic in Daily Life & Coffee Shops`,channel:`Arabic Immersion Hub`,targetLang:`Arabic`,targetLangCode:`ar`,nativeLang:`English`,nativeLangCode:`en`,level:`Beginner`,category:`Daily Dialogues`,thumbnail:`https://images.unsplash.com/photo-1541167760496-1628856ab772?auto=format&fit=crop&w=600&q=80`,description:`Listen to natural greetings, ordering coffee, social pleasantries, and directions in warm conversational Arabic.`,subtitles:[{id:1,start:0,end:4.5,text:`صباح الخير! بدي قهوة مظبوط لو سمحت.`,transliteration:`Sabah al-khair! Baddi qahwah mazboot law samaht.`,translation:`Good morning! I would like a coffee with medium sugar, please.`,notes:`Everyday Levantine and Gulf colloquial Arabic.`}]}];function Cn(){let e=new Map;return T.forEach(t=>e.set(t.id,t)),Sn.forEach(t=>e.set(t.id,t)),pn().forEach(t=>{e.has(t.id)||e.set(t.id,t)}),Array.from(e.values())}function wn(e){let t=pn().find(t=>t.id===e.id);mn({...e,fetchedAt:e.fetchedAt??t?.fetchedAt??Date.now(),lastOpened:e.lastOpened??t?.lastOpened})}function Tn(e){let t=pn().find(t=>t.youtubeId===e);t&&mn({...t,lastOpened:Date.now()})}function En(e){hn(e)}var Dn=`polytube_last_video_v1`,On=`polytube_progress_v1`,kn=300;function An(){try{return JSON.parse(localStorage.getItem(On)||`{}`)}catch{return{}}}function jn(e,t,n){if(e&&Number.isFinite(t))try{let r=An();delete r[e],r[e]={t:Math.max(0,Math.floor(t)),dur:Math.floor(n||0),at:Date.now()};let i=Object.keys(r);if(i.length>kn)for(let e of i.slice(0,i.length-kn))delete r[e];localStorage.setItem(On,JSON.stringify(r)),localStorage.setItem(Dn,e)}catch{}}function Mn(e){return An()[e]??null}function Nn(){return An()}function Pn(e){try{let t=An();for(let[n,r]of Object.entries(e))(!t[n]||t[n].at<r.at)&&(t[n]=r);localStorage.setItem(On,JSON.stri
